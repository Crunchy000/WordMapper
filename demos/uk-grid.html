<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Three everyday words name any place in the UK to an 11 m square. Nothing else is needed to decode them.">
<title>UK grid — three easy words, an 11-metre square</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  /* No card: the address sits directly on the map, with a halo rather than a
     panel so it reads over pale streets and dark satellite tiles alike. */
  #hud { position: absolute; z-index: 1000; top: 16px; left: 16px;
         pointer-events: none; max-width: calc(100vw - 32px); }
  #addr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 24px; font-weight: 700; color: #16171a; letter-spacing: -0.01em;
          line-height: 1.3;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 0 0 16px #fff,
                       1px 0 3px #fff, -1px 0 3px #fff, 0 -1px 3px #fff; }
  /* Each word is unbreakable, and a line may only break after a dot, so a long
     address wraps between words rather than through one. */
  #addr .w { white-space: nowrap; }
  #note { font-size: 12px; color: #4a4a44; margin-top: 5px; font-weight: 600;
          max-width: 44ch; line-height: 1.45;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 1px 0 3px #fff, -1px 0 3px #fff; }
  #note .dim { color: #8a8a82; font-weight: 400; }
  #note .err { color: #a8322a; }
  /* #hud is pointer-events:none so clicks fall through to the map; the form
     has to opt back in. */
  #find { margin-top: 10px; pointer-events: auto; display: flex; gap: 6px; }
  #q { font: inherit; font-size: 14px; padding: 5px 9px; width: 220px; max-width: 60vw;
       border: 1px solid #c9c9c0; border-radius: 999px; background: #ffffffdd;
       color: #16171a; backdrop-filter: blur(2px); }
  #q:focus-visible, #go:focus-visible { outline: 2px solid #4f9481; outline-offset: 2px; }
  #go { font: inherit; font-size: 13px; padding: 5px 11px; border: 1px solid #1a5c4a;
        border-radius: 999px; background: #1a5c4a; color: #fff; cursor: pointer; }
  @media (max-width: 480px) {
    #hud { top: 12px; left: 12px; }
    #addr { font-size: 19px; }
  }
</style>
</head>

// Lambert azimuthal equal-area on the sphere, centred on the UK.
const RAD = Math.PI / 180;
const P0 = LAT0 * RAD, L0 = LNG0 * RAD, SIN0 = Math.sin(P0), COS0 = Math.cos(P0);

function project(lat, lng) {
  const p = lat * RAD, dl = lng * RAD - L0;
  const sp = Math.sin(p), cp = Math.cos(p), cl = Math.cos(dl);
  const k = Math.sqrt(2 / (1 + SIN0 * sp + COS0 * cp * cl));
  return [R * k * cp * Math.sin(dl), R * k * (COS0 * sp - SIN0 * cp * cl)];
}

function unproject(x, y) {
  const rho = Math.hypot(x, y);
  if (rho === 0) return [LAT0, LNG0];
  const c = 2 * Math.asin(rho / (2 * R)), sc = Math.sin(c), cc = Math.cos(c);
  return [Math.asin(cc * SIN0 + y * sc * COS0 / rho) / RAD,
          (L0 + Math.atan2(x * sc, rho * COS0 * cc - y * SIN0 * sc)) / RAD];
}

function sha256(bytes) {

  padded[len] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 4, len * 8);
  const w = new Uint32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    const dv = new DataView(padded.buffer, off, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });

  return H;

// --- the scramble ------------------------------------------------------------
// A six-round Feistel network over two halves of 46,656. The 'uk' prefix keys it
// apart from the global grid's.
function roundFn(i, half) {
  const p = new Uint8Array(7);
  p[0] = 0x75; p[1] = 0x6b; p[2] = i;           // 'u', 'k', round
  new DataView(p.buffer).setUint32(3, half);
  const h = sha256(p);
  return (h[0] >>> 0) % HALF;
}

function scramble(v) {
  let left = Math.floor(v / HALF), right = v % HALF;
  for (let i = 0; i < ROUNDS; i++) [left, right] = [right, (left + roundFn(i, right)) % HALF];
  return left * HALF + right;
}

function unscramble(n) {
  let left = Math.floor(n / HALF), right = n % HALF;
  for (let i = ROUNDS - 1; i >= 0; i--)
    [left, right] = [(((right - roundFn(i, left)) % HALF) + HALF) % HALF, left];
  return left * HALF + right;
}

// --- addresses ----------------------------------------------------------------
// The cell value of a point, before scrambling, or null outside the mask.
function valueAt(lat, lng) {
  const [x, y] = project(lat, lng);
  const fx = (x - X0) / SQUARE, fy = (y - Y0) / SQUARE;
  const i = Math.floor(fx), j = Math.floor(fy);
  if (i < 0 || i >= GRID_W || j < 0 || j >= GRID_H) return null;
  const rank = RANK.get(j * GRID_W + i);
  if (rank === undefined) return null;
  const col = Math.min(Math.floor((fx - i) * K), K - 1);
  const row = Math.min(Math.floor((fy - j) * K), K - 1);
  return (rank * K + row) * K + col;
}

// The cell a value names: its corners, south-west first, in the plane.
function cellXY(v) {
  const rank = Math.floor(v / (K * K)), rest = v % (K * K);
  const row = Math.floor(rest / K), col = rest % K;
  const s = SQUARES[rank], j = Math.floor(s / GRID_W), i = s % GRID_W;
  return [X0 + i * SQUARE + col * CELL, Y0 + j * SQUARE + row * CELL];
}

function centreOf(v) {
  const [x, y] = cellXY(v);
  return unproject(x + CELL / 2, y + CELL / 2);
}

function numberToWords(n) {
  const out = [];
  for (let i = 0; i < N_WORDS; i++) { out.push(WORDS[n % LIST_SIZE]); n = Math.floor(n / LIST_SIZE); }
  return out.reverse();
}

const wordsFor = (v) => numberToWords(scramble(v));

function encode(lat, lng) {
  const v = valueAt(lat, lng);
  if (v === null) throw new Error('outside the UK grid');
  return wordsFor(v);
}

function decodeValue(spoken) {
  const unknown = spoken.filter((w) => !INDEX.has(w));
  if (unknown.length) throw new Error(`not on the word list: ${unknown.join(', ')}`);
  if (spoken.length !== N_WORDS) throw new Error(`an address is ${N_WORDS} words`);
  const v = unscramble(spoken.reduce((n, w) => n * LIST_SIZE + INDEX.get(w), 0));
  if (v >= CELLS) throw new Error('no such address - a word is wrong');
  return v;
}

const decode = (spoken) => centreOf(decodeValue(spoken));

const formatAddress = (spoken) => spoken.join(SEP);

function parseAddress(text) {
  const parts = text.trim().replace(/[,\s]+/g, SEP).split(SEP).filter(Boolean)
    .map((p) => p.toLowerCase());
  if (!parts.length) throw new Error('empty address');
  return parts;
}

  });
}

const NOTE = `${(CELL).toFixed(1)} m square &middot; <strong>says where you are</strong>`
  + '<span class="dim"> &mdash; decodes in this page with nothing else involved. UK only. '
  + 'There is no check word: a misheard word lands somewhere unrelated in the UK.</span>';

function draw(v, lat, lng) {
  if (marker) map.removeLayer(marker);
  if (square) map.removeLayer(square);
  if (lat !== null)
    marker = L.circleMarker([lat, lng],
      { radius: 5, color: '#a8322a', weight: 2, fillOpacity: .9 }).addTo(map);
  const [x, y] = cellXY(v);
  square = L.polygon([unproject(x, y), unproject(x + CELL, y),
                      unproject(x + CELL, y + CELL), unproject(x, y + CELL)],
    { color: '#1a5c4a', weight: 2, fillOpacity: .08 }).addTo(map);
}

function show(lat, lng) {
  const v = valueAt(lat, lng);
  if (v === null) {
    if (marker) map.removeLayer(marker);
    if (square) map.removeLayer(square);
    marker = null; square = null;
    addrEl.textContent = '';
    noteEl.innerHTML = '<span class="err">Outside the UK grid</span>'
      + '<span class="dim"> &mdash; the UK, the Isle of Man, the Channel Islands and a strip '
      + 'of coastal sea.</span>';
    return;
  }
  showWords(wordsFor(v));
  noteEl.innerHTML = NOTE;
  draw(v, lat, lng);
}

document.getElementById('find').addEventListener('submit', (e) => {
  e.preventDefault();
  let v;
  try { v = decodeValue(parseAddress(qEl.value)); }
  catch (err) {
    noteEl.innerHTML = `<span class="err">${err.message.replace(/</g, '&lt;')}</span>`;
    return;
  }
  showWords(wordsFor(v));
  noteEl.innerHTML = NOTE;
  draw(v, null, null);
  map.setView(centreOf(v), 19);
});

map.on('click', (e) => show(e.latlng.lat, e.latlng.lng));
show(51.50072, -0.12456);
</script>
</body>
</html>
