// Generalized Hilbert curve for arbitrary width x height (Jakub Cerveny's gilbert2d, ported to JS)
function sgn(x) { return x < 0 ? -1 : (x > 0 ? 1 : 0); }
function generate2d(x, y, ax, ay, bx, by, out) {
  const w = Math.abs(ax + ay), h = Math.abs(bx + by);
  const dax = sgn(ax), day = sgn(ay);
  const dbx = sgn(bx), dby = sgn(by);
  if (h === 1) {
    for (let i = 0; i < w; i++) { out.push([x, y]); x += dax; y += day; }
    return;
  }
  if (w === 1) {
    for (let i = 0; i < h; i++) { out.push([x, y]); x += dbx; y += dby; }
    return;
  }
  let ax2 = Math.floor(ax / 2), ay2 = Math.floor(ay / 2);
  let bx2 = Math.floor(bx / 2), by2 = Math.floor(by / 2);
  const w2 = Math.abs(ax2 + ay2), h2 = Math.abs(bx2 + by2);
  if (2 * w > 3 * h) {
    if ((w2 % 2 !== 0) && (w > 2)) { ax2 += dax; ay2 += day; }
    generate2d(x, y, ax2, ay2, bx, by, out);
    generate2d(x + ax2, y + ay2, ax - ax2, ay - ay2, bx, by, out);
  } else {
    if ((h2 % 2 !== 0) && (h > 2)) { bx2 += dbx; by2 += dby; }
    generate2d(x, y, bx2, by2, ax2, ay2, out);
    generate2d(x + bx2, y + by2, ax, ay, bx - bx2, by - by2, out);
    generate2d(x + (ax - dax) + (bx2 - dbx), y + (ay - day) + (by2 - dby), -bx2, -by2, -(ax - ax2), -(ay - ay2), out);
  }
}
function gilbert2d(width, height) {
  const out = [];
  if (width >= height) generate2d(0, 0, width, 0, 0, height, out);
  else generate2d(0, 0, 0, height, width, 0, out);
  return out;
}

// A square grid keeps cell aspect constant at every level (it is boxAspect *
// (GRID_W/GRID_H)^level, so any non-square grid compounds). 41x41 is also the
// smallest square grid that holds the word list, and unlike 41x40 it yields a
// continuous Hilbert path.
const GRID_W = 41, GRID_H = 41; // 1681 cells, holds all 1633 words with 48 unused
const gilbertCoords = gilbert2d(GRID_W, GRID_H); // ordered list of [x,y], length 1681
const resolutions = ['~20 x 30 km', '~480 x 730 m', '~12 x 18 m'];

function rectFor(box, xIdx, yIdx, xSpan, ySpan) {
  const lat0 = box.latMax - yIdx * ySpan;
  const lat1 = box.latMax - (yIdx + 1) * ySpan;
  const lng0 = box.lngMin + xIdx * xSpan;
  const lng1 = box.lngMin + (xIdx + 1) * xSpan;
  return [[lat1, lng0], [lat0, lng1]];
}

const DEFAULT_BLURB = document.getElementById('resolution').textContent;

    levelRects[i] = [];
  }
  const latSpan = (box.latMax - box.latMin) / GRID_H;
  const lngSpan = (box.lngMax - box.lngMin) / GRID_W;
  const opacity = levelIdx === 0 ? 0.22 : 0.42;
  for (let d = 0; d < gilbertCoords.length; d++) {
    if (d >= words.length) break; // skip the 7 unused cells beyond the word list
    const [x, y] = gilbertCoords[d];
    const cellBounds = rectFor(box, x, y, lngSpan, latSpan);
    const hue = Math.round((d / words.length) * 300);
    const rect = L.rectangle(cellBounds, { color: `hsl(${hue},55%,50%)`, weight: levelIdx === 0 ? 1 : 0.6, fillOpacity: opacity }).addTo(map);
    rect.on('click', (ev) => {
      L.DomEvent.stopPropagation(ev);
      selectedWords = selectedWords.slice(0, levelIdx);
      selectedWords.push(words[d]);
      updatePanel();
      const nextBox = { latMin: cellBounds[0][0], latMax: cellBounds[1][0], lngMin: cellBounds[0][1], lngMax: cellBounds[1][1] };
      if (levelIdx < 2) drawLevel(nextBox, levelIdx + 1);
      if (document.getElementById('zoom-toggle').checked) {
        map.fitBounds(cellBounds, { maxZoom: 18 });
      }
    });
    levelRects[levelIdx].push(rect);
  }
}

function updatePanel() {
  document.getElementById('addr').innerHTML = selectedWords.length
    ? `<code>${selectedWords.join('.')}</code>` : 'Click any level-1 cell to begin';
  document.getElementById('resolution').textContent = selectedWords.length
    ? `Resolution with ${selectedWords.length} word(s): ${resolutions[selectedWords.length - 1]}`
    : DEFAULT_BLURB;
}

document.getElementById('reset').addEventListener('click', () => {
  selectedWords = [];
  levelRects.forEach(level => level.forEach(r => map.removeLayer(r)));
  levelRects = [[], [], []];
  document.getElementById('zoom-toggle').checked = false;
  map.fitBounds([[bbox.latMin, bbox.lngMin], [bbox.latMax, bbox.lngMax]]);
  updatePanel();
  drawLevel(bbox, 0);
});

drawLevel(bbox, 0);
updatePanel();
</script>
</body>
</html>
