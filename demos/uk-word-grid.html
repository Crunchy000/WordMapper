<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word grid — UK &amp; Ireland</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; }

  /* Floating address card. The wrapper ignores pointer events so the map stays
     draggable everywhere except on the card itself. */
  #hud {
    position: absolute; z-index: 1000; top: 14px; left: 14px;
    pointer-events: none; max-width: calc(100vw - 28px);
  }
  #card {
    pointer-events: auto; display: inline-block;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(6px);
    border-radius: 10px; padding: 12px 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.10);
  }
  #addr {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 20px; letter-spacing: .01em; color: #16171a; word-break: break-word;
  }
  #addr .dot { color: #9a9a94; }
  #addr .hint {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; color: #5c5c56; letter-spacing: 0;
  }
  #meta {
    margin-top: 5px; font-size: 12px; color: #5c5c56;
    display: flex; gap: 10px; align-items: center;
  }
  #codes { margin-top: 9px; border-top: 1px solid #e6e6e0; padding-top: 8px; }
  .code {
    display: flex; gap: 8px; align-items: baseline; margin-top: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
  }
  .code .tag {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 11px; color: #5c5c56; width: 92px; flex: none; text-align: right;
  }
  .code .chk { color: #1a5c4a; }
  #reset {
    font: inherit; font-size: 12px; color: #1a5c4a; background: none;
    border: 0; padding: 0; cursor: pointer; text-decoration: underline;
  }

  /* Word label that follows the cursor, so you can read a cell before clicking. */
  #tip {
    position: absolute; z-index: 1100; pointer-events: none;
    transform: translate(-50%, -140%);
    background: #16171a; color: #fff; border-radius: 5px;
    padding: 3px 8px; font-size: 13px; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="hud">
  <div id="card">
    <div id="addr"><span class="hint">Click a cell to begin</span></div>
    <div id="meta"><span id="scale"></span><button id="reset" hidden>reset</button></div>
    <div id="codes" hidden>
      <div class="code"><span class="tag">self-correcting</span><span id="c4"></span></div>
      <div class="code"><span class="tag">error-correcting</span><span id="c5"></span></div>
    </div>
  </div>
</div>
<div id="tip" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);
const boundaryRect = L.rectangle([[bbox.latMin, bbox.lngMin], [bbox.latMax, bbox.lngMax]], { color: '#222', weight: 2, fill: false }).addTo(map);

// Generalized Hilbert curve for arbitrary width x height (Jakub Cerveny's gilbert2d, ported to JS)
function sgn(x) { return x < 0 ? -1 : (x > 0 ? 1 : 0); }
function generate2d(x, y, ax, ay, bx, by, out) {
  const w = Math.abs(ax + ay), h = Math.abs(bx + by);
  const dax = sgn(ax), day = sgn(ay);
  const dbx = sgn(bx), dby = sgn(by);
  if (h === 1) {
    for (let i = 0; i < w; i++) { out.push([x, y]); x += dax; y += day; }
    return;
  }
  if (w === 1) {
    for (let i = 0; i < h; i++) { out.push([x, y]); x += dbx; y += dby; }
    return;
  }
  let ax2 = Math.floor(ax / 2), ay2 = Math.floor(ay / 2);
  let bx2 = Math.floor(bx / 2), by2 = Math.floor(by / 2);
  const w2 = Math.abs(ax2 + ay2), h2 = Math.abs(bx2 + by2);
  if (2 * w > 3 * h) {
    if ((w2 % 2 !== 0) && (w > 2)) { ax2 += dax; ay2 += day; }
    generate2d(x, y, ax2, ay2, bx, by, out);
    generate2d(x + ax2, y + ay2, ax - ax2, ay - ay2, bx, by, out);
  } else {
    if ((h2 % 2 !== 0) && (h > 2)) { bx2 += dbx; by2 += dby; }
    generate2d(x, y, bx2, by2, ax2, ay2, out);
    generate2d(x + bx2, y + by2, ax, ay, bx - bx2, by - by2, out);
    generate2d(x + (ax - dax) + (bx2 - dbx), y + (ay - day) + (by2 - dby), -bx2, -by2, -(ax - ax2), -(ay - ay2), out);
  }
}
function gilbert2d(width, height) {
  const out = [];
  if (width >= height) generate2d(0, 0, width, 0, 0, height, out);
  else generate2d(0, 0, 0, height, width, 0, out);
  return out;
}

// A square grid keeps cell aspect constant at every level (it is boxAspect *
// (GRID_W/GRID_H)^level, so any non-square grid compounds). 41x41 is also the
// smallest square grid that holds the word list, and unlike 41x40 it yields a
// continuous Hilbert path.
const GRID_W = 43, GRID_H = 43; // 1849 cells, exactly one per word
const gilbertCoords = gilbert2d(GRID_W, GRID_H); // ordered list of [x,y], length 1849
// --- Self-correcting addresses: Reed-Solomon over GF(53^2) ------------------
// The list is 1849 = 43^2 words and 43 is prime, so GF(1849) is a real field
// and one word is exactly one field element. See tools/codec/wordcode.py.
const GF_P = 43;
const GF_NR = 2;   // least quadratic non-residue mod 43, so x^2-2 is irreducible
const gEl = (i) => [i % GF_P, Math.floor(i / GF_P)];
const gIdx = (u) => u[0] + GF_P * u[1];
const gMod = (x) => ((x % GF_P) + GF_P) % GF_P;
const gAdd = (u, v) => [gMod(u[0] + v[0]), gMod(u[1] + v[1])];
const gSub = (u, v) => [gMod(u[0] - v[0]), gMod(u[1] - v[1])];
const gMul = (u, v) => [gMod(u[0] * v[0] + u[1] * v[1] * GF_NR), gMod(u[0] * v[1] + u[1] * v[0])];
// Distinct weight per position, so swapping two words changes the check. A
// plain sum would not: addition is commutative, and swaps would pass silently.
const WEIGHT_A = [gEl(1), gEl(2), gEl(3)];
const WEIGHT_B = WEIGHT_A.map((a) => gMul(a, a));

function checkWord(threeIdx, weights) {
  let t = [0, 0];
  for (let i = 0; i < 3; i++) t = gAdd(t, gMul(weights[i], gEl(threeIdx[i])));
  return words[gIdx(gSub([0, 0], t))];
}
// 1 check corrects any single word known to be wrong; 2 corrects one wrong word
// at an unknown position. Nested: the 4-word form is a prefix of the 5-word one.
function protectedForms(three) {
  const ids = three.map((w) => words.indexOf(w));
  const c1 = checkWord(ids, WEIGHT_A);
  return { four: [...three, c1], five: [...three, c1, checkWord(ids, WEIGHT_B)] };
}

if (gilbertCoords.length !== words.length) {
  throw new Error(`grid has ${gilbertCoords.length} cells but the word list has ${words.length}`);
}
const resolutions = ['~19 x 29 km', '~440 x 660 m', '~10 x 15 m'];

function rectFor(box, xIdx, yIdx, xSpan, ySpan) {
  const lat0 = box.latMax - yIdx * ySpan;
  const lat1 = box.latMax - (yIdx + 1) * ySpan;
  const lng0 = box.lngMin + xIdx * xSpan;
  const lng1 = box.lngMin + (xIdx + 1) * xSpan;
  return [[lat1, lng0], [lat0, lng1]];
}

const addrEl = document.getElementById('addr');
const codesEl = document.getElementById('codes');
const c4El = document.getElementById('c4');
const c5El = document.getElementById('c5');
const scaleEl = document.getElementById('scale');
const resetEl = document.getElementById('reset');
const tipEl = document.getElementById('tip');

let levelRects = [[], [], []];
let selectedWords = [];

function drawLevel(box, levelIdx) {
  levelRects[levelIdx].forEach(r => map.removeLayer(r));
  levelRects[levelIdx] = [];
  for (let i = levelIdx + 1; i < 3; i++) {
    levelRects[i].forEach(r => map.removeLayer(r));
    levelRects[i] = [];
  }
  const latSpan = (box.latMax - box.latMin) / GRID_H;
  const lngSpan = (box.lngMax - box.lngMin) / GRID_W;
  const opacity = levelIdx === 0 ? 0.22 : 0.42;
  for (let d = 0; d < gilbertCoords.length; d++) {
    const [x, y] = gilbertCoords[d];
    const cellBounds = rectFor(box, x, y, lngSpan, latSpan);
    const hue = Math.round((d / words.length) * 300);
    const rect = L.rectangle(cellBounds, { color: `hsl(${hue},55%,50%)`, weight: levelIdx === 0 ? 1 : 0.6, fillOpacity: opacity }).addTo(map);
    const word = words[d];
    // Show the word under the cursor: a cell's word is otherwise only knowable
    // by clicking it, which also subdivides it.
    rect.on('mouseover', (ev) => showTip(word, ev));
    rect.on('mousemove', (ev) => showTip(word, ev));
    rect.on('mouseout', hideTip);
    rect.on('click', (ev) => {
      L.DomEvent.stopPropagation(ev);
      hideTip();
      selectedWords = selectedWords.slice(0, levelIdx);
      selectedWords.push(word);
      updateCard();
      const nextBox = { latMin: cellBounds[0][0], latMax: cellBounds[1][0], lngMin: cellBounds[0][1], lngMax: cellBounds[1][1] };
      if (levelIdx < 2) drawLevel(nextBox, levelIdx + 1);
      // Always zoom in. A child cell is a fraction of a pixel at the parent's
      // zoom, so without this the next level cannot be clicked at all.
      map.fitBounds(cellBounds, { maxZoom: 19 });
    });
    levelRects[levelIdx].push(rect);
  }
}

function showTip(word, ev) {
  tipEl.textContent = word;
  tipEl.style.left = `${ev.originalEvent.clientX}px`;
  tipEl.style.top = `${ev.originalEvent.clientY}px`;
  tipEl.hidden = false;
}
function hideTip() { tipEl.hidden = true; }

function updateCard() {
  if (!selectedWords.length) {
    addrEl.replaceChildren(el('span', 'hint', 'Click a cell to begin'));
    scaleEl.textContent = `${words.length.toLocaleString()} words · ${GRID_W}x${GRID_H} grid`;
    resetEl.hidden = true;
    codesEl.hidden = true;
    return;
  }
  // Build the address as nodes rather than innerHTML, so a word can never be
  // read as markup.
  const parts = [];
  selectedWords.forEach((w, i) => {
    if (i) parts.push(el('span', 'dot', '.'));
    parts.push(document.createTextNode(w));
  });
  addrEl.replaceChildren(...parts);
  scaleEl.textContent = resolutions[selectedWords.length - 1];
  resetEl.hidden = false;

  // The code carries exactly three location words, so the protected forms only
  // exist once all three are chosen.
  if (selectedWords.length === 3) {
    const { four, five } = protectedForms(selectedWords);
    renderCode(c4El, four, 1);
    renderCode(c5El, five, 2);
    codesEl.hidden = false;
  } else {
    codesEl.hidden = true;
  }
}

function renderCode(target, parts, nChecks) {
  const nodes = [];
  parts.forEach((w, i) => {
    if (i) nodes.push(el('span', 'dot', '.'));
    // tint the check words so it is obvious which carry location
    nodes.push(i >= parts.length - nChecks ? el('span', 'chk', w) : document.createTextNode(w));
  });
  target.replaceChildren(...nodes);
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  n.className = cls;
  n.textContent = text;
  return n;
}

resetEl.addEventListener('click', () => {
  selectedWords = [];
  levelRects.forEach(level => level.forEach(r => map.removeLayer(r)));
  levelRects = [[], [], []];
  hideTip();
  map.fitBounds([[bbox.latMin, bbox.lngMin], [bbox.latMax, bbox.lngMax]]);
  updateCard();
  drawLevel(bbox, 0);
});

drawLevel(bbox, 0);
updateCard();
</script>
