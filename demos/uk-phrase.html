<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A four-word phrase -- adjective noun verb noun -- names any place in the UK to a 7.5 m square, and refuses a misheard word 95% of the time.">
<title>UK phrases — four words, a 7.5-metre square</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  /* No card: the address sits directly on the map, with a halo rather than a
     panel so it reads over pale streets and dark satellite tiles alike. */
  #hud { position: absolute; z-index: 1000; top: 16px; left: 16px;
         pointer-events: none; max-width: calc(100vw - 32px); }
  #addr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 24px; font-weight: 700; color: #16171a; letter-spacing: -0.01em;
          line-height: 1.3;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 0 0 16px #fff,
                       1px 0 3px #fff, -1px 0 3px #fff, 0 -1px 3px #fff; }
  /* Each word is unbreakable, and a line may only break after a dot, so a long
     address wraps between words rather than through one. */
  #addr .w { white-space: nowrap; display: inline-block; text-align: left; }
  /* The slot under each word, so the pattern teaches itself. */
  #addr .w small { display: block; font: 600 9px/1.2 -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif; letter-spacing: .04em;
                   text-transform: uppercase; color: #8a8a82; }
  #note { font-size: 12px; color: #4a4a44; margin-top: 5px; font-weight: 600;
          max-width: 44ch; line-height: 1.45;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 1px 0 3px #fff, -1px 0 3px #fff; }
  #note .dim { color: #8a8a82; font-weight: 400; }
  #note .err { color: #a8322a; }
  /* #hud is pointer-events:none so clicks fall through to the map; the form
     has to opt back in. */
  #find { margin-top: 10px; pointer-events: auto; display: flex; gap: 6px; }
  #q { font: inherit; font-size: 14px; padding: 5px 9px; width: 220px; max-width: 60vw;
       border: 1px solid #c9c9c0; border-radius: 999px; background: #ffffffdd;
       color: #16171a; backdrop-filter: blur(2px); }
  #q:focus-visible, #go:focus-visible { outline: 2px solid #4f9481; outline-offset: 2px; }
  #go { font: inherit; font-size: 13px; padding: 5px 11px; border: 1px solid #1a5c4a;
        border-radius: 999px; background: #1a5c4a; color: #fff; cursor: pointer; }
  @media (max-width: 480px) {
    #hud { top: 12px; left: 12px; }
    #addr { font-size: 19px; }
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="hud">

  <div id="note">Click anywhere</div>
  <form id="find" autocomplete="off">

           spellcheck="false" autocapitalize="none">
    <button id="go" type="submit">Go</button>
  </form>
</div>

// Lambert azimuthal equal-area on the sphere, centred on the UK.
const RAD = Math.PI / 180;
const P0 = LAT0 * RAD, L0 = LNG0 * RAD, SIN0 = Math.sin(P0), COS0 = Math.cos(P0);

function project(lat, lng) {
  const p = lat * RAD, dl = lng * RAD - L0;
  const sp = Math.sin(p), cp = Math.cos(p), cl = Math.cos(dl);
  const k = Math.sqrt(2 / (1 + SIN0 * sp + COS0 * cp * cl));
  return [R * k * cp * Math.sin(dl), R * k * (COS0 * sp - SIN0 * cp * cl)];
}

function unproject(x, y) {

  if (rho === 0) return [LAT0, LNG0];
  const c = 2 * Math.asin(rho / (2 * R)), sc = Math.sin(c), cc = Math.cos(c);
  return [Math.asin(cc * SIN0 + y * sc * COS0 / rho) / RAD,
          (L0 + Math.atan2(x * sc, rho * COS0 * cc - y * SIN0 * sc)) / RAD];

    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) {

      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;

      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });

// --- the scramble ------------------------------------------------------------
// A Feistel network on unequal halves: left is the adjective and first noun
// (LEFT values), right the verb and second noun (RIGHT). Each round takes
// (L, R) in Z_a x Z_b to (R, (L + F(R)) mod a) in Z_b x Z_a, a bijection
// whatever a and b are; six rounds land back on Z_LEFT x Z_RIGHT.
function roundFn(i, half, modulus) {
  const p = new Uint8Array(12);
  p.set(te.encode('ukp')); p[3] = i;
  new DataView(p.buffer).setBigUint64(4, BigInt(half));
  return Number(shaInt(p, 8) % BigInt(modulus));
}

function scramble(v) {
  let a = LEFT, b = RIGHT;
  let left = Math.floor(v / b), right = v % b;
  for (let i = 0; i < ROUNDS; i++) {
    [left, right] = [right, (left + roundFn(i, right, a)) % a];
    [a, b] = [b, a];
  }
  return left * b + right;
}

function unscramble(n) {
  let a = LEFT, b = RIGHT;
  let left = Math.floor(n / b), right = n % b;
  for (let i = ROUNDS - 1; i >= 0; i--) {
    [a, b] = [b, a];
    [left, right] = [(((right - roundFn(i, left, a)) % a) + a) % a, left];
  }
  return left * RIGHT + right;
}

  if (i < 0 || i >= GRID_W || j < 0 || j >= GRID_H) return null;

  const row = Math.min(Math.floor((fy - j) * K), K - 1);

  const [x, y] = cellXY(cell);

  if (v >= USED) throw new Error('no such phrase - a word is wrong');
  const cell = Math.floor(v / CHECK);
  if (cellCheck(cell) !== v % CHECK) throw new Error('check failed - a word is wrong');
  return cell;
}

const decode = (spoken) => centreOf(decodeCell(spoken));

function parsePhrase(text) {
  const parts = text.trim().replace(/[,\s]+/g, '.').split('.').filter(Boolean)
    .map((p) => p.toLowerCase());
  if (!parts.length) throw new Error('empty phrase');
  return parts;
}

// --- map --------------------------------------------------------------------
const map = L.map('map', { zoomControl: false }).setView([51.50072, -0.12456], 18);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const addrEl = document.getElementById('addr');
const noteEl = document.getElementById('note');
const qEl = document.getElementById('q');
let marker = null, square = null;

// The separator stays on the word it follows, so a line that continues ends in
// a dot and the address is still correct if it is copied.
// Spaces, not dots: a phrase is read as a sentence. The slot sits under each
// word so the pattern teaches itself.
function showWords(spoken) {
  addrEl.textContent = '';
  spoken.forEach((w, i) => {
    const el = document.createElement('span');
    el.className = 'w';
    el.textContent = w;
    const lbl = document.createElement('small');
    lbl.textContent = PATTERN[i];
    el.appendChild(lbl);
    addrEl.append(el);
    if (i < spoken.length - 1) addrEl.append(' ');
  });
}

const NOTE = `${(CELL).toFixed(1)} m square &middot; <strong>says where you are</strong>`
  + '<span class="dim"> &mdash; decodes in this page with nothing else involved. UK only. '
  + 'A misheard word is refused at least 95% of the time, and always when it breaks '
  + 'the pattern.</span>';

function draw(cell, lat, lng) {
  if (marker) map.removeLayer(marker);
  if (square) map.removeLayer(square);
  if (lat !== null)
    marker = L.circleMarker([lat, lng],
      { radius: 5, color: '#a8322a', weight: 2, fillOpacity: .9 }).addTo(map);
  const [x, y] = cellXY(cell);
  square = L.polygon([unproject(x, y), unproject(x + CELL, y),
                      unproject(x + CELL, y + CELL), unproject(x, y + CELL)],
    { color: '#1a5c4a', weight: 2, fillOpacity: .08 }).addTo(map);
}

function show(lat, lng) {
  const cell = cellAt(lat, lng);
  if (cell === null) {
    if (marker) map.removeLayer(marker);
    if (square) map.removeLayer(square);
    marker = null; square = null;
    addrEl.textContent = '';
    noteEl.innerHTML = '<span class="err">Outside the UK grid</span>'
      + '<span class="dim"> &mdash; the UK, the Isle of Man, the Channel Islands and a strip '
      + 'of coastal sea.</span>';
    return;
  }
  showWords(phraseFor(cell));
  noteEl.innerHTML = NOTE;
  draw(cell, lat, lng);
}

document.getElementById('find').addEventListener('submit', (e) => {
  e.preventDefault();
  let cell;
  try { cell = decodeCell(parsePhrase(qEl.value)); }
  catch (err) {
    noteEl.innerHTML = `<span class="err">${err.message.replace(/</g, '&lt;')}</span>`;
    return;
  }
  showWords(phraseFor(cell));
  noteEl.innerHTML = NOTE;
  draw(cell, null, null);
  map.setView(centreOf(cell), 19);
});

map.on('click', (e) => show(e.latlng.lat, e.latlng.lng));
show(51.50072, -0.12456);
</script>
</body>
</html>
