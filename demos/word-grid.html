<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Four everyday words name any place on earth to one H3 hexagon about 19 m across. Nothing else is needed to decode them.">
<title>Word grid — four easy words, one house-sized hexagon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  /* No card: the address sits directly on the map, with a halo rather than a
     panel so it reads over pale streets and dark satellite tiles alike. */
  #hud { position: absolute; z-index: 1000; top: 16px; left: 16px;
         pointer-events: none; max-width: calc(100vw - 32px); }
  #addr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 24px; font-weight: 700; color: #16171a; letter-spacing: -0.01em;
          line-height: 1.3; overflow-wrap: anywhere;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 0 0 16px #fff,
                       1px 0 3px #fff, -1px 0 3px #fff, 0 -1px 3px #fff; }
  #note { font-size: 12px; color: #4a4a44; margin-top: 5px; font-weight: 600;
          max-width: 44ch; line-height: 1.45;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 1px 0 3px #fff, -1px 0 3px #fff; }
  #note .dim { color: #8a8a82; font-weight: 400; }
  #note .err { color: #a8322a; }
  /* #hud is pointer-events:none so clicks fall through to the map; the form
     has to opt back in. */
  #find { margin-top: 10px; pointer-events: auto; display: flex; gap: 6px; }
  #q { font: inherit; font-size: 14px; padding: 5px 9px; width: 220px; max-width: 60vw;
       border: 1px solid #c9c9c0; border-radius: 999px; background: #ffffffdd;
       color: #16171a; backdrop-filter: blur(2px); }
  #q:focus-visible, #go:focus-visible { outline: 2px solid #4f9481; outline-offset: 2px; }
  #go { font: inherit; font-size: 13px; padding: 5px 11px; border: 1px solid #1a5c4a;
        border-radius: 999px; background: #1a5c4a; color: #fff; cursor: pointer; }
  @media (max-width: 480px) {
    #hud { top: 12px; left: 12px; }
    #addr { font-size: 19px; }
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="hud">
  <div id="addr"></div>
  <div id="note">Click anywhere</div>
  <form id="find" autocomplete="off">
    <input id="q" type="text" placeholder="four words" aria-label="Look up four words"
           spellcheck="false" autocapitalize="none">
    <button id="go" type="submit">Go</button>
  </form>
</div>

// --- the scheme ------------------------------------------------------------
// Must match tools/gridcode/bip39grid.py exactly; CI cross-checks them.
//
// FOUR WORDS NAME ONE H3 RESOLUTION-12 HEXAGON (the h3 global, from h3-js):
// 10.8 m on an edge, about 19 m across, 307 m^2 -- a house. 1296**4 is 2.82
// trillion addresses and H3 has 1.69 trillion resolution-12 slots, so it fits
// 1.67 times over: no whole factor to spare, so there is no check, and the 40 %
// of values past the last cell are simply refused.
//
// The four words are one number, not one word per level:
//   ordinal = base cell * 7**12 + its twelve digits in base 7
//   value   = ordinal * CHECK + check      (CHECK is 1, so value = ordinal)
//   number  = scramble(value)              (a permutation of 1296**4)
//   words   = number in base 1296
//
// THE SCRAMBLE IS THE SAFETY. With no check most misheard words decode, so it
// makes them obvious: changing any word sends the address somewhere unrelated
// on earth, rather than next door.
const LIST_SIZE = 1296;
const N_WORDS = 4;
const SPACE = LIST_SIZE ** N_WORDS;              // 2,821,109,907,456
const BASE_CELLS = 122;
const APERTURE = 7;
const RES = 12;
const CELLS = BASE_CELLS * APERTURE ** RES;      // 1,688,637,038,522
const CHECK = Math.floor(SPACE / CELLS);         // 1
const USED = CELLS * CHECK;
const HALF = LIST_SIZE ** (N_WORDS / 2);         // SPACE === HALF ** 2
const ROUNDS = 6;
const SEP = '.';
const R = 6371008.8;

const SHA_K = [

  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,

function sha256(bytes) {
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const len = bytes.length;
  const padded = new Uint8Array((((len + 9) >> 6) + 1) << 6);
  padded.set(bytes);
  padded[len] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 4, len * 8);
  const w = new Uint32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    const dv = new DataView(padded.buffer, off, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
  }
  return H;
}

const shaInt = (bytes, n) => {        // the first n (<= 8) bytes of sha256, as a number
  const h = sha256(bytes);
  const v = (BigInt(h[0] >>> 0) << 32n) | BigInt(h[1] >>> 0);
  return v >> BigInt(64 - 8 * n);
};

// --- H3 cells as ordinals -----------------------------------------------------

// base cell at 45-51, then fifteen 3-bit digits, resolution 1 highest, unused 7.
function cellToOrdinal(cell) {
  const h = BigInt('0x' + cell);
  let x = Number((h >> 45n) & 0x7Fn);
  for (let r = 1; r <= RES; r++) x = x * APERTURE + Number((h >> BigInt((15 - r) * 3)) & 7n);
  return x;
}

function ordinalToCell(x) {
  const digits = [];
  for (let i = 0; i < RES; i++) { digits.push(x % APERTURE); x = Math.floor(x / APERTURE); }
  let h = (1n << 59n) | (BigInt(RES) << 52n) | (BigInt(x) << 45n);
  for (let r = 1; r <= 15; r++)
    h |= BigInt(r <= RES ? digits[RES - r] : 7) << BigInt((15 - r) * 3);
  return h.toString(16);
}

const cellAt = (lat, lng) => h3.latLngToCell(lat, lng, RES);

function cellCheck(cell) {
  const p = new Uint8Array(8);
  new DataView(p.buffer).setBigUint64(0, BigInt('0x' + cell));
  return Number(shaInt(p, 8) % BigInt(CHECK));
}

// --- the scramble -------------------------------------------------------------
// A six-round Feistel network over two halves of 1,679,616: a bijection on
// every four-word combination, with nothing left over.
function roundFn(i, half) {
  const p = new Uint8Array(5);
  p[0] = i;
  new DataView(p.buffer).setUint32(1, half);
  return Number(shaInt(p, 8) % BigInt(HALF));
}

function scramble(v) {
  let left = Math.floor(v / HALF), right = v % HALF;
  for (let i = 0; i < ROUNDS; i++) [left, right] = [right, (left + roundFn(i, right)) % HALF];
  return left * HALF + right;
}

function unscramble(n) {
  let left = Math.floor(n / HALF), right = n % HALF;
  for (let i = ROUNDS - 1; i >= 0; i--)
    [left, right] = [(((right - roundFn(i, left)) % HALF) + HALF) % HALF, left];
  return left * HALF + right;
}

// --- addresses ----------------------------------------------------------------
// A number in [0, SPACE) as N_WORDS words, most significant first.
function numberToWords(n) {
  const out = [];
  for (let i = 0; i < N_WORDS; i++) { out.push(WORDS[n % LIST_SIZE]); n = Math.floor(n / LIST_SIZE); }
  return out.reverse();
}

const encodeCell = (cell) => numberToWords(scramble(cellToOrdinal(cell) * CHECK + cellCheck(cell)));

const encode = (lat, lng) => encodeCell(cellAt(lat, lng));

// The cell four words name. Throws for a wrong word when it can tell, which is
// about 40 % of the time.
function decodeCell(spoken) {
  const unknown = spoken.filter((w) => !INDEX.has(w));
  if (unknown.length) throw new Error(`not on the word list: ${unknown.join(', ')}`);
  if (spoken.length !== N_WORDS) throw new Error(`an address is ${N_WORDS} words`);
  const v = unscramble(spoken.reduce((n, w) => n * LIST_SIZE + INDEX.get(w), 0));
  if (v >= USED) throw new Error('no such address - a word is wrong');
  const ordinal = Math.floor(v / CHECK), chk = v % CHECK;
  const cell = ordinalToCell(ordinal);
  if (!h3.isValidCell(cell)) throw new Error('no such cell - a word is wrong');
  if (cellCheck(cell) !== chk) throw new Error('check failed - a word is wrong');
  return cell;
}

const decode = (spoken) => h3.cellToLatLng(decodeCell(spoken));

const formatAddress = (spoken) => spoken.join(SEP);

function parseAddress(text) {
  const parts = text.trim().replace(/[,\s]+/g, SEP).split(SEP).filter(Boolean)
    .map((p) => p.toLowerCase());
  if (!parts.length) throw new Error('empty address');
  return parts;
}

// --- map --------------------------------------------------------------------
// The zoom control sits top right: the address lives top left, where it reads
// best, and the two were overlapping.
const map = L.map('map', { worldCopyJump: true, zoomControl: false })
  .setView([53.3498, -6.2603], 18);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const addrEl = document.getElementById('addr');
const noteEl = document.getElementById('note');
const qEl = document.getElementById('q');
let marker = null, hexagon = null;

const wrapLng = (lng) => ((lng + 180) % 360 + 360) % 360 - 180;

function hav(lat1, lng1, lat2, lng2) {
  const rad = Math.PI / 180, p1 = lat1 * rad, p2 = lat2 * rad;
  const a = Math.sin((p2 - p1) / 2) ** 2
    + Math.cos(p1) * Math.cos(p2) * Math.sin((lng2 - lng1) * rad / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

// The hexagon's edge, measured on the cell itself: H3 cells vary in size across
// the globe, so an average would be wrong somewhere.
function edge(cell) {
  const c = h3.cellToLatLng(cell);
  return Math.max(...h3.cellToBoundary(cell).map((v) => hav(...c, ...v)));
}

// Vertices are unwrapped against the given longitude, so a hexagon on the
// antimeridian is drawn as itself rather than as a band round the world.
function draw(cell, lat, lng) {
  if (marker) map.removeLayer(marker);
  if (hexagon) map.removeLayer(hexagon);
  marker = L.circleMarker([lat, lng],
    { radius: 5, color: '#a8322a', weight: 2, fillOpacity: .9 }).addTo(map);
  const ring = h3.cellToBoundary(cell).map(([a, b]) => [a, lng + wrapLng(b - lng)]);
  hexagon = L.polygon(ring, { color: '#1a5c4a', weight: 2, fillOpacity: .08 }).addTo(map);
}

function describe(cell) {
  return `${Math.round(Math.sqrt(3) * edge(cell))} m hexagon &middot; `
    + '<strong>says where you are</strong>'
    + '<span class="dim"> &mdash; decodes in this page with nothing else involved. '
    + 'A misheard word is refused 40% of the time, and otherwise lands somewhere '
    + 'unrelated on earth.</span>';
}

function show(lat, lng) {
  const cell = cellAt(lat, lng);
  addrEl.textContent = formatAddress(encode(lat, lng));
  noteEl.innerHTML = describe(cell);
  draw(cell, lat, lng);
}

document.getElementById('find').addEventListener('submit', (e) => {
  e.preventDefault();
  let cell;
  try { cell = decodeCell(parseAddress(qEl.value)); }
  catch (err) {
    noteEl.innerHTML = `<span class="err">${err.message.replace(/</g, '&lt;')}</span>`;
    return;
  }
  const [lat, lng] = h3.cellToLatLng(cell);
  addrEl.textContent = formatAddress(encodeCell(cell));
  noteEl.innerHTML = describe(cell);
  draw(cell, lat, lng);
  map.setView([lat, lng], 18);
});

map.on('click', (e) => show(e.latlng.lat, wrapLng(e.latlng.lng)));
show(53.3498, -6.2603);
</script>
</body>
</html>
