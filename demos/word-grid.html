<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word grid — 70 km lattice</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  #hud { position: absolute; z-index: 1000; top: 14px; left: 14px; pointer-events: none;
         max-width: calc(100vw - 28px); }
  #card { pointer-events: auto; display: inline-block; background: rgba(255,255,255,.95);
          backdrop-filter: blur(6px); border-radius: 10px; padding: 13px 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.10); }
  #addr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 20px; color: #16171a; word-break: break-word; }
  #addr .dot { color: #9a9a94; }
  #addr .chk { color: #1a5c4a; }
  .hint { font-family: inherit; font-size: 15px; color: #5c5c56; }
  #meta { margin-top: 5px; font-size: 12px; color: #5c5c56; }
  .row { margin-top: 9px; padding-top: 8px; border-top: 1px solid #e6e6e0;
         font-size: 12px; color: #5c5c56; }
  label.opt { display: block; margin-top: 4px; }
  input[type=text] { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 13px; padding: 4px 6px; width: 15.5em; border: 1px solid #ccc; border-radius: 5px; }
  button { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 5px;
           border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #err { color: #a8322a; margin-top: 4px; min-height: 1em; }
  #tip { position: absolute; z-index: 1100; pointer-events: none; transform: translate(-50%,-140%);
         background: #16171a; color: #fff; border-radius: 5px; padding: 3px 8px; font-size: 12px;
         white-space: nowrap; }
</style>
</head>
<body>

<div id="map"></div>
<div id="hud">
  <div id="card">
    <div id="addr"><span class="hint">Click anywhere on the map</span></div>
    <div id="meta"></div>
    <div class="row">
      <label class="opt"><input type="checkbox" id="check8"> 8 check bits (12 m cell, catches 99.6% of wrong words)</label>
      <label class="opt"><input type="checkbox" id="showreps" checked> show where this address repeats</label>
    </div>
    <div class="row">
      resolve an address near the map centre:<br>
      <input type="text" id="dec" placeholder="shoulder.few.lottery" autocomplete="off">
      <button id="go">go</button>
      <div id="err"></div>
    </div>
  </div>
</div>
<div id="tip" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const INDEX = new Map(WORDS.map((w, i) => [w, i]));

// --- the scheme ------------------------------------------------------------
// Must match tools/gridcode/bip39grid.py exactly; a cross-check compares them.
const R = 6371008.8;
const K = Math.cos(30 * Math.PI / 180);   // Lambert equal-area standard parallel
const CHUNK = 70000;                      // metres, in projected (equal-area) units
const BITS = 11, NWORDS = 3;

const project = (lat, lng) => [R * (lng * Math.PI / 180) * K, R * Math.sin(lat * Math.PI / 180) / K];
const unproject = (x, y) => [Math.asin(Math.max(-1, Math.min(1, y * K / R))) * 180 / Math.PI,
                             x / (R * K) * 180 / Math.PI];

function bitOrder(xb, yb) {
  const o = [];
  for (let i = Math.max(xb, yb) - 1; i >= 0; i--) {
    if (i < xb) o.push(['x', i]);
    if (i < yb) o.push(['y', i]);
  }
  return o;
}
function splitBits(check) { const p = NWORDS * BITS - check; return [p, (p + 1) >> 1, p >> 1]; }

// 33 bits does not fit a JS number safely, so the index is a BigInt throughout.
function interleave(x, y, xb, yb) {
  let v = 0n;
  for (const [ax, i] of bitOrder(xb, yb)) v = (v << 1n) | (((ax === 'x' ? x : y) >> BigInt(i)) & 1n);
  return v;
}
function deinterleave(v, xb, yb) {
  const order = bitOrder(xb, yb);
  let x = 0n, y = 0n;
  order.forEach(([ax, i], pos) => {
    const bit = (v >> BigInt(order.length - 1 - pos)) & 1n;
    if (ax === 'x') x |= bit << BigInt(i); else y |= bit << BigInt(i);
  });
  return [x, y];
}
// SHA-256 in plain JS. crypto.subtle would be neater but only exists in a
// secure context, so it is undefined when this file is opened from disk --
// which would silently break the checksum for anyone who downloads the demo.
const SHA_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(bytes) {
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const len = bytes.length;
  const padded = new Uint8Array((((len + 9) >> 6) + 1) << 6);
  padded.set(bytes);
  padded[len] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 4, len * 8);
  const w = new Uint32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    const dv = new DataView(padded.buffer, off, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
  }
  return H;
}

function checksum(position, bits) {
  if (!bits) return 0n;
  const bytes = new Uint8Array(8);
  let p = position;
  for (let i = 7; i >= 0; i--) { bytes[i] = Number(p & 0xffn); p >>= 8n; }
  return BigInt(sha256(bytes)[0] >>> (32 - bits));
}

const mod = (a, n) => ((a % n) + n) % n;

function encode(lat, lng, check) {
  const [, xb, yb] = splitBits(check);
  const [x, y] = project(lat, lng);
  const u = mod(x, CHUNK), v = mod(y, CHUNK);
  const xi = BigInt(Math.min(Math.floor(u / CHUNK * 2 ** xb), 2 ** xb - 1));
  const yi = BigInt(Math.min(Math.floor(v / CHUNK * 2 ** yb), 2 ** yb - 1));
  const position = interleave(xi, yi, xb, yb);
  const value = (position << BigInt(check)) | checksum(position, check);
  const out = [];
  for (let i = 0; i < NWORDS; i++)
    out.push(WORDS[Number((value >> BigInt(BITS * (NWORDS - 1 - i))) & 0x7ffn)]);
  return out;
}

function decode(spoken, nearLat, nearLng, check) {
  const unknown = spoken.filter((w) => !INDEX.has(w));
  if (unknown.length) throw new Error(`not BIP-39 words: ${unknown.join(', ')}`);
  let value = 0n;
  for (const w of spoken) value = (value << BigInt(BITS)) | BigInt(INDEX.get(w));
  const position = value >> BigInt(check);
  if (check && (value & ((1n << BigInt(check)) - 1n)) !== checksum(position, check))
    throw new Error('checksum failed - a word is wrong');
  const [, xb, yb] = splitBits(check);
  const [xi, yi] = deinterleave(position, xb, yb);
  const u = (Number(xi) + 0.5) / 2 ** xb * CHUNK;
  const v = (Number(yi) + 0.5) / 2 ** yb * CHUNK;
  const [nx, ny] = project(nearLat, nearLng);
  // Pick the lattice square nearest the position hint. This is the whole point:
  // the square is not in the address, so the hint supplies it.
  return unproject(Math.floor((nx - u) / CHUNK + 0.5) * CHUNK + u,
                   Math.floor((ny - v) / CHUNK + 0.5) * CHUNK + v);
}

// --- map -------------------------------------------------------------------
const map = L.map('map', { worldCopyJump: true }).setView([51.50072, -0.12456], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const addrEl = document.getElementById('addr');
const metaEl = document.getElementById('meta');
const errEl = document.getElementById('err');
const tipEl = document.getElementById('tip');
const check8 = document.getElementById('check8');
const showReps = document.getElementById('showreps');

let marker = null, square = null, repeats = [], point = null;
const checkBits = () => (check8.checked ? 8 : 0);

function el(tag, cls, text) { const n = document.createElement(tag); n.className = cls; n.textContent = text; return n; }

function renderAddress(parts, check) {
  const nodes = [];
  parts.forEach((w, i) => {
    if (i) nodes.push(el('span', 'dot', '.'));
    nodes.push(check && i === parts.length - 1 ? el('span', 'chk', w) : document.createTextNode(w));
  });
  addrEl.replaceChildren(...nodes);
}

function squareAround(lat, lng) {
  const [x, y] = project(lat, lng);
  const x0 = Math.floor(x / CHUNK) * CHUNK, y0 = Math.floor(y / CHUNK) * CHUNK;
  const sw = unproject(x0, y0), ne = unproject(x0 + CHUNK, y0 + CHUNK);
  return [[sw[0], sw[1]], [ne[0], ne[1]]];
}

function clearOverlays() {
  repeats.forEach((r) => map.removeLayer(r));
  repeats = [];
  if (square) { map.removeLayer(square); square = null; }
}

function show(lat, lng) {
  point = [lat, lng];
  const check = checkBits();
  const parts = encode(lat, lng, check);
  renderAddress(parts, check);
  const [, xb, yb] = splitBits(check);
  metaEl.textContent = `cell ${(CHUNK / 2 ** xb).toFixed(2)} x ${(CHUNK / 2 ** yb).toFixed(2)} m`
    + `  ·  ${check ? '8 check bits' : 'no checksum'}`;

  if (marker) map.removeLayer(marker);
  marker = L.circleMarker([lat, lng], { radius: 6, color: '#a8322a', weight: 2, fillOpacity: .9 }).addTo(map);
  clearOverlays();
  square = L.rectangle(squareAround(lat, lng), { color: '#1a5c4a', weight: 2, fill: false, dashArray: '4 3' }).addTo(map);

  if (showReps.checked) {
    const [x, y] = project(lat, lng);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      if (!dx && !dy) continue;
      const [la, lo] = unproject(x + dx * CHUNK, y + dy * CHUNK);
      if (Math.abs(la) > 89) continue;
      const km = map.distance([lat, lng], [la, lo]) / 1000;
      const m = L.circleMarker([la, lo], { radius: 4, color: '#b8860b', weight: 2, fillOpacity: .7 }).addTo(map);
      m.on('mouseover', (ev) => {
        tipEl.textContent = `same address, ${km.toFixed(1)} km away`;
        tipEl.style.left = `${ev.originalEvent.clientX}px`;
        tipEl.style.top = `${ev.originalEvent.clientY}px`;
        tipEl.hidden = false;
      });
      m.on('mouseout', () => { tipEl.hidden = true; });
      repeats.push(m);
    }
  }
}

map.on('click', (e) => { errEl.textContent = ''; show(e.latlng.lat, e.latlng.lng); });
check8.addEventListener('change', () => { if (point) show(point[0], point[1]); });
showReps.addEventListener('change', () => { if (point) show(point[0], point[1]); });

document.getElementById('go').addEventListener('click', () => {
  const raw = document.getElementById('dec').value.trim().toLowerCase();
  const parts = raw.split(/[.\s,]+/).filter(Boolean);
  errEl.textContent = '';
  if (parts.length !== NWORDS) { errEl.textContent = `expected ${NWORDS} words`; return; }
  try {
    const c = map.getCenter();
    const [lat, lng] = decode(parts, c.lat, c.lng, checkBits());
    map.setView([lat, lng], Math.max(map.getZoom(), 15));
    show(lat, lng);
  } catch (e) { errEl.textContent = e.message; }
});

show(51.50072, -0.12456);
</script>
