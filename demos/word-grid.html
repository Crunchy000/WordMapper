<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word grid — a region and up to four words</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  #hud { position: absolute; z-index: 1000; top: 14px; left: 14px; pointer-events: none;
         max-width: calc(100vw - 28px); }
  #card { pointer-events: auto; display: inline-block; background: rgba(255,255,255,.95);
          backdrop-filter: blur(6px); border-radius: 10px; padding: 13px 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.10); }
  table { border-collapse: collapse; font-size: 14px; }
  td { padding: 2px 0; vertical-align: baseline; }
  td.a { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         padding-right: 14px; color: #b9b9b2; white-space: nowrap; }
  td.a .new { color: #16171a; font-weight: 600; }
  td.a .dot { color: #cfcfc8; }
  td.s { font-size: 12px; color: #5c5c56; white-space: nowrap; }
  tr.sel td.a .new, tr.sel td.a { color: #16171a; }
  tr.sel td.s { color: #1a5c4a; font-weight: 600; }
  tr:hover td.s { color: #16171a; }
  .hint { font-size: 15px; color: #5c5c56; }
  .row { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e6e6e0;
         font-size: 12px; color: #5c5c56; }
  #chk { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #1a5c4a; }
  input[type=text] { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 13px; padding: 4px 6px; width: 16em; border: 1px solid #ccc; border-radius: 5px; }
  button { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 5px;
           border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #err { color: #a8322a; margin-top: 4px; min-height: 1em; }
  #regline { margin-bottom: 7px; }
  #region { font: inherit; font-size: 12px; max-width: 26em; padding: 2px 4px;
            border: 1px solid #ccc; border-radius: 5px; background: #fff; }
  #regnote { font-size: 11px; color: #8a8a82; margin-top: 3px; }
  td.a .reg { color: #1a5c4a; font-weight: 600; }
  /* On a phone the five-word row is wider than the screen; let it wrap and
     shrink rather than pushing the page sideways. */
  @media (max-width: 480px) {
    #card { padding: 11px 13px; }
    table { font-size: 12px; }
    td.a { white-space: normal; word-break: break-word; padding-right: 10px; }
    td.s { font-size: 11px; }
    input[type=text] { width: 11em; }
    #region { max-width: calc(100vw - 76px); }
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="hud">
  <div id="card">
    <div id="empty" class="hint">Click anywhere on earth</div>
    <div id="regline">
      <select id="region"></select>
      <div id="regnote"></div>
    </div>
    <table id="rows" hidden></table>
    <div class="row">
      resolve an address (any length):<br>
      <input type="text" id="dec" placeholder="GB.plug.curtain.elder" autocomplete="off">
      <button id="go">go</button>
      <div id="err"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// Must match tools/gridcode/bip39grid.py exactly; CI cross-checks them.
const R = 6371008.8;
const K = Math.cos(30 * Math.PI / 180);
const BITS = 11, MAX_WORDS = 4;
// The last word does two jobs: 4 bits refine the position, 7 carry a checksum.
// The checksum covers the region code as well, so naming the wrong region
// fails the same check as saying the wrong word.
const REFINE_BITS = 4, CHECK_BITS = BITS - REFINE_BITS;
const POSITION_BITS = BITS * (MAX_WORDS - 1) + REFINE_BITS;
const PRECISION = (POSITION_BITS + 1) >> 1;
const EPS = 1e-9;
const SEP = '.';

const project = (lat, lng) => [R * lng * Math.PI / 180 * K,
                               R * Math.sin(lat * Math.PI / 180) / K];
const unproject = (x, y) => [Math.asin(Math.max(-1, Math.min(1, y * K / R))) * 180 / Math.PI,
                             x / (R * K) * 180 / Math.PI];

function region(code) {
  const r = REGIONS.get(code);
  if (!r) throw new Error(`no region "${code}" in the registry`);
  return r;
}

// A region straddling the antimeridian has a box running past 180 -- Fiji is
// 176.9 to 182.0 -- so a point there arrives as -179 and must be read as 181.
// The short circuit matters: a value a hair BELOW lngMin would otherwise wrap
// to nearly lngMin + 360, throwing a point on the western edge out of its box.
function normaliseLng(lng, code) {
  const r = region(code), lngMin = r[4], lngMax = r[5];
  if (lng >= lngMin - EPS && lng <= lngMax + EPS) return lng;
  return lngMin + ((((lng - lngMin) % 360) + 360) % 360);
}

function covers(lat, lng, code) {
  const r = region(code);
  const l = normaliseLng(lng, code);
  return lat >= r[2] - EPS && lat <= r[3] + EPS && l >= r[4] - EPS && l <= r[5] + EPS;
}

function frame(code) {
  if (!frames.has(code)) {
    const r = region(code);
    frames.set(code, [...project(r[2], r[4]), ...project(r[3], r[5])]);
  }
  return frames.get(code);
}

function boxArea(code) {
  const [x0, y0, x1, y1] = frame(code);
  return Math.abs((x1 - x0) * (y1 - y0));
}

// Tightest first: a smaller box is a finer cell, so the head of this list is
// the best address available and the tail is the most widely known.
function regionsCovering(lat, lng) {
  return REGION_LIST.filter((r) => covers(lat, lng, r[0])).map((r) => r[0])

// genuinely a prefix. Deriving the order per length does not work: 11 bits per
// word is odd, so 33 bits splits the axes 17/16 while 22 and 44 split evenly.
function fullIndex(lat, lng, code) {

  // one: decode maps onto the box and nowhere else, so an outside point would
  // alias onto a real address inside it and pass its own checksum.
  if (!covers(lat, lng, code)) throw new Error(`outside ${code}`);

  // and an unclamped negative index would sign-extend under >> into a
  // plausible address for the wrong place.
  const cell = (v, lo, hi) => BigInt(Math.min(Math.max(

const positionBits = (n) => (n < MAX_WORDS ? BITS * n : POSITION_BITS);
const axisBits = (n) => { const b = positionBits(n); return [(b + 1) >> 1, b >> 1]; };

function cellSize(n, code) {
  const [x0, y0, x1, y1] = frame(code);
  const [xb, yb] = axisBits(n);
  return [Math.abs(x1 - x0) / 2 ** xb, Math.abs(y1 - y0) / 2 ** yb];

  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(bytes) {
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const len = bytes.length;
  const padded = new Uint8Array((((len + 9) >> 6) + 1) << 6);
  padded.set(bytes);
  padded[len] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 4, len * 8);
  const w = new Uint32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    const dv = new DataView(padded.buffer, off, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
  }
  return H;
}


function checksum(position, code) {
  const bytes = [];
  for (let i = 0; i < code.length; i++) bytes.push(code.charCodeAt(i) & 0xff);
  bytes.push(0);
  const p = new Array(8);
  let v = position;
  for (let i = 7; i >= 0; i--) { p[i] = Number(v & 0xffn); v >>= 8n; }
  return BigInt(sha256(bytes.concat(p))[0] >>> (32 - CHECK_BITS));
}

function encode(lat, lng, n, code) {
  const position = fullIndex(lat, lng, code) >> BigInt(2 * PRECISION - positionBits(n));
  const value = n < MAX_WORDS ? position
    : (position << BigInt(CHECK_BITS)) | checksum(position, code);
  const out = [];
  for (let i = 0; i < n; i++) out.push(WORDS[Number((value >> BigInt(BITS * (n - 1 - i))) & 0x7ffn)]);
  return out;
}

function decode(spoken, code) {
  region(code);
  const unknown = spoken.filter((w) => !INDEX.has(w));
  if (unknown.length) throw new Error(`not BIP-39 words: ${unknown.join(', ')}`);
  if (spoken.length < 1 || spoken.length > MAX_WORDS) throw new Error(`1 to ${MAX_WORDS} words`);
  let value = 0n;
  for (const w of spoken) value = (value << BigInt(BITS)) | BigInt(INDEX.get(w));
  let prefix;
  if (spoken.length < MAX_WORDS) prefix = value;
  else {
    prefix = value >> BigInt(CHECK_BITS);
    if ((value & ((1n << BigInt(CHECK_BITS)) - 1n)) !== checksum(prefix, code))
      throw new Error('checksum failed - a word or the region is wrong');
  }
  const bits = positionBits(spoken.length);
  const [xb, yb] = axisBits(spoken.length);
  let xi = 0n, yi = 0n;
  for (let pos = 0; pos < bits; pos++) {
    const bit = (prefix >> BigInt(bits - 1 - pos)) & 1n;
    if (pos % 2 === 0) xi = (xi << 1n) | bit; else yi = (yi << 1n) | bit;
  }
  const [x0, y0, x1, y1] = frame(code);
  const x = x0 + (Number(xi) + 0.5) / 2 ** xb * (x1 - x0);
  const y = y0 + (Number(yi) + 0.5) / 2 ** yb * (y1 - y0);
  const ll = unproject(x, y);
  return [ll[0], ((ll[1] + 180) % 360 + 360) % 360 - 180];
}

const formatAddress = (code, spoken) => [code, ...spoken].join(SEP);

// The region is the first token, and never collides with a word: BIP-39 has no
// word shorter than three letters and none containing a digit or a hyphen.
function parseAddress(text) {
  const parts = text.replace(/[,\s]+/g, SEP).split(SEP).filter(Boolean);
  if (!parts.length) throw new Error('empty address');
  return [parts[0].toUpperCase(), parts.slice(1).map((p) => p.toLowerCase())];
}

// --- map -------------------------------------------------------------------
const map = L.map('map', { worldCopyJump: true }).setView([51.50072, -0.12456], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
const errEl = document.getElementById('err');
const regEl = document.getElementById('region');
const regNoteEl = document.getElementById('regnote');
let marker = null, boxes = [], regionBox = null;
let point = null, selected = 3, code = null;

const fmt = (m) => m >= 1000 ? `${(m / 1000).toFixed(1)} km`
  : m >= 1 ? `${m.toFixed(1)} m` : `${(m * 100).toFixed(0)} cm`;
const cellOf = (n, c) => { const [w, h] = cellSize(n, c); return Math.sqrt(w * h); };

function cellBounds(lat, lng, n, c) {
  const [xb, yb] = axisBits(n);
  const [x0, y0, x1, y1] = frame(c);
  const [x, y] = project(lat, normaliseLng(lng, c));
  const w = (x1 - x0) / 2 ** xb, h = (y1 - y0) / 2 ** yb;
  const cx = x0 + Math.floor((x - x0) / w) * w, cy = y0 + Math.floor((y - y0) / h) * h;
  return [unproject(cx, cy), unproject(cx + w, cy + h)];
}

// Every region whose box covers the point, so the caller can pick the one they
// actually know they are standing in. Tightest first: that is the finest cell.
function fillRegions(lat, lng) {
  const codes = regionsCovering(lat, lng);
  regEl.replaceChildren();
  for (const c of codes) {
    const o = document.createElement('option');
    o.value = c;
    o.textContent = `${c} — ${region(c)[1]} (${fmt(cellOf(MAX_WORDS, c))})`;
    regEl.appendChild(o);
  }
  if (!codes.includes(code)) code = codes[0];
  regEl.value = code;
  regNoteEl.textContent = codes.length > 1
    ? `${codes.length} regions cover this point — say whichever one you know`
    : 'the only region covering this point';
  return codes;
}

function show(lat, lng) {
  point = [lat, lng];
  errEl.textContent = '';
  if (marker) map.removeLayer(marker);
  marker = L.circleMarker([lat, lng],
    { radius: 5, color: '#a8322a', weight: 2, fillOpacity: .9 }).addTo(map);
  boxes.forEach((b) => map.removeLayer(b)); boxes = [];
  if (regionBox) { map.removeLayer(regionBox); regionBox = null; }

  const codes = fillRegions(lat, lng);
  if (!codes.length) {          // XZ makes this unreachable unless the registry
    rowsEl.hidden = true;       // is edited, but the codec must never invent one
    emptyEl.hidden = false;
    emptyEl.textContent = 'No region covers this point, so there is no address.';
    return;
  }
  emptyEl.hidden = true; rowsEl.hidden = false;
  rowsEl.replaceChildren();
  const full = encode(lat, lng, MAX_WORDS, code);
  for (let n = 1; n <= MAX_WORDS; n++) {
    const tr = document.createElement('tr');
    if (n === selected) tr.className = 'sel';
    const td = document.createElement('td'); td.className = 'a';
    const pre = document.createElement('span');
    pre.className = 'reg'; pre.textContent = code; td.appendChild(pre);
    full.slice(0, n).forEach((word, i) => {
      const d = document.createElement('span');
      d.className = 'dot'; d.textContent = SEP; td.appendChild(d);
      // Only the word this row adds is highlighted; the rest are already said.
      const w = document.createElement('span');
      if (i === n - 1) w.className = 'new';
      w.textContent = word; td.appendChild(w);
    });
    const ts = document.createElement('td'); ts.className = 's';
    ts.textContent = n === MAX_WORDS ? `${fmt(cellOf(n, code))} · checked`
                                     : fmt(cellOf(n, code));
    tr.append(td, ts);
    tr.addEventListener('click', () => { selected = n; show(lat, lng); });
    rowsEl.appendChild(tr);
  }
  // The region's own box, then the nesting: each length inside the previous.
  const r = region(code);
  regionBox = L.rectangle([[r[2], r[4]], [r[3], r[5]]],
    { color: '#1a5c4a', weight: 1, fill: false, dashArray: '5 4', opacity: .55 }).addTo(map);
  for (let n = 1; n <= Math.min(selected + 1, MAX_WORDS); n++) {
    boxes.push(L.rectangle(cellBounds(lat, lng, n, code),
      { color: n === selected ? '#1a5c4a' : '#8a8a82',
        weight: n === selected ? 2 : 1, fill: false }).addTo(map));
  }
}

const wrap = (lng) => ((lng + 180) % 360 + 360) % 360 - 180;
map.on('click', (e) => show(e.latlng.lat, wrap(e.latlng.lng)));
regEl.addEventListener('change', () => {
  code = regEl.value;
  if (point) show(point[0], point[1]);
});

document.getElementById('go').addEventListener('click', () => {
  errEl.textContent = '';
  try {
    const [c, parts] = parseAddress(document.getElementById('dec').value.trim());
    const [lat, lng] = decode(parts, c);
    code = c; selected = parts.length;
    map.fitBounds(cellBounds(lat, lng, parts.length, c), { maxZoom: 19 });
    show(lat, lng);
  } catch (e) { errEl.textContent = e.message; }
});

show(51.50072, -0.12456);
</script>
</body>
</html>
