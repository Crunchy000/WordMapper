<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word grid — say as many words as you need</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  #hud { position: absolute; z-index: 1000; top: 14px; left: 14px; pointer-events: none;
         max-width: calc(100vw - 28px); }
  #card { pointer-events: auto; display: inline-block; background: rgba(255,255,255,.95);
          backdrop-filter: blur(6px); border-radius: 10px; padding: 13px 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.10); }
  table { border-collapse: collapse; font-size: 14px; }
  td { padding: 2px 0; vertical-align: baseline; }
  td.a { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         padding-right: 14px; color: #b9b9b2; white-space: nowrap; }
  td.a .new { color: #16171a; font-weight: 600; }
  td.a .dot { color: #cfcfc8; }
  td.s { font-size: 12px; color: #5c5c56; white-space: nowrap; }
  tr.sel td.a .new, tr.sel td.a { color: #16171a; }
  tr.sel td.s { color: #1a5c4a; font-weight: 600; }
  tr:hover td.s { color: #16171a; }
  .hint { font-size: 15px; color: #5c5c56; }
  .row { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e6e6e0;
         font-size: 12px; color: #5c5c56; }
  #chk { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #1a5c4a; }
  input[type=text] { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 13px; padding: 4px 6px; width: 16em; border: 1px solid #ccc; border-radius: 5px; }
  button { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 5px;
           border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #err { color: #a8322a; margin-top: 4px; min-height: 1em; }
  /* On a phone the five-word row is wider than the screen; let it wrap and
     shrink rather than pushing the page sideways. */
  @media (max-width: 480px) {
    #card { padding: 11px 13px; }
    table { font-size: 12px; }
    td.a { white-space: normal; word-break: break-word; padding-right: 10px; }
    td.s { font-size: 11px; }
    input[type=text] { width: 11em; }
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="hud">
  <div id="card">
    <div id="empty" class="hint">Click anywhere in the UK or Ireland</div>
    <table id="rows" hidden></table>
    <div class="row">
      resolve an address (any length):<br>
      <input type="text" id="dec" placeholder="plug.curtain.elder" autocomplete="off">
      <button id="go">go</button>
      <div id="err"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

 "update", "upgrade", "uphold", "upon", "upper", "upset", "urban", "urge", "usage", "use", "used", "useful", "useless", "usual", "utility", "vacant", "vacuum", "vague", "valid", "valley", "valve", "van", "vanish", "vapor", "various", "vast", "vault", "vehicle", "velvet", "vendor", "venture", "venue", "verb", "verify", "version", "very", "vessel", "veteran", "viable", "vibrant", "vicious", "victory", "video", "view", "village", "vintage", "violin", "virtual", "virus", "visa", "visit", "visual", "vital", "vivid", "vocal", "voice", "void", "volcano", "volume", "vote", "voyage", "wage", "wagon", "wait", "walk", "wall", "walnut", "want", "warfare", "warm", "warrior", "wash", "wasp", "waste", "water", "wave", "way", "wealth", "weapon", "wear", "weasel", "weather", "web", "wedding", "weekend", "weird", "welcome", "west", "wet", "whale", "what", "wheat", "wheel", "when", "where", "whip", "whisper", "wide", "width", "wife", "wild", "will", "win", "window", "wine", "wing", "wink", "winner", "winter", "wire", "wisdom", "wise", "wish", "witness", "wolf", "woman", "wonder", "wood", "wool", "word", "work", "world", "worry", "worth", "wrap", "wreck", "wrestle", "wrist", "write", "wrong", "yard", "year", "yellow", "you", "young", "youth", "zebra", "zero", "zone", "zoo"];

const INDEX = new Map(WORDS.map((w, i) => [w, i]));

// --- the scheme ------------------------------------------------------------
// Must match tools/gridcode/bip39grid.py exactly; CI cross-checks them.
const R = 6371008.8;
const K = Math.cos(30 * Math.PI / 180);
const BITS = 11, MAX_WORDS = 4;
// The last word does two jobs: 4 bits refine the position, 7 carry a checksum.
// Three words alone is 10.75 m (wide); a whole fourth word of position would be
// 24 cm (finer than needed). Split, it lands at 2.69 m and verified.
const REFINE_BITS = 4, CHECK_BITS = BITS - REFINE_BITS;
const POSITION_BITS = BITS * (MAX_WORDS - 1) + REFINE_BITS;
const PRECISION = (POSITION_BITS + 1) >> 1;
const BOX = { latMin: 49.85, latMax: 60.90, lngMin: -11.00, lngMax: 1.80 };

const project = (lat, lng) => [R * (lng * Math.PI / 180) * K, R * Math.sin(lat * Math.PI / 180) / K];
const unproject = (x, y) => [Math.asin(Math.max(-1, Math.min(1, y * K / R))) * 180 / Math.PI,
                             x / (R * K) * 180 / Math.PI];
const [X0, Y0] = project(BOX.latMin, BOX.lngMin);
const [X1, Y1] = project(BOX.latMax, BOX.lngMax);

// SHA-256 in plain JS. crypto.subtle would be neater but only exists in a
// secure context, so it is undefined when this file is opened from disk --
// which would silently break the checksum for anyone who downloads the demo.
const SHA_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(bytes) {
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const len = bytes.length;
  const padded = new Uint8Array((((len + 9) >> 6) + 1) << 6);
  padded.set(bytes);
  padded[len] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 4, len * 8);
  const w = new Uint32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    const dv = new DataView(padded.buffer, off, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
  }
  return H;
}


// The checksum lives in the low bits of the last word, which is why four words
// is terminal: a fifth would have to reinterpret them.
function checksum(position) {
  const bytes = new Uint8Array(8);
  let p = position;
  for (let i = 7; i >= 0; i--) { bytes[i] = Number(p & 0xffn); p >>= 8n; }
  return BigInt(sha256(bytes)[0] >>> (32 - CHECK_BITS));
}

// Interleave ONCE at full precision, then truncate, so every length is
// genuinely a prefix. Deriving the order per length does not work: 11 bits per
// word is odd, so 33 bits splits the axes 17/16 while 22 and 44 split evenly.
function fullIndex(lat, lng) {
  const [x, y] = project(lat, lng);
  const xi = BigInt(Math.min(Math.floor((x - X0) / (X1 - X0) * 2 ** PRECISION), 2 ** PRECISION - 1));
  const yi = BigInt(Math.min(Math.floor((y - Y0) / (Y1 - Y0) * 2 ** PRECISION), 2 ** PRECISION - 1));
  let v = 0n;
  for (let i = PRECISION - 1; i >= 0; i--) {
    v = (v << 1n) | ((xi >> BigInt(i)) & 1n);
    v = (v << 1n) | ((yi >> BigInt(i)) & 1n);
  }
  return v;
}
const positionBits = (n) => (n < MAX_WORDS ? BITS * n : POSITION_BITS);
const axisBits = (n) => { const b = positionBits(n); return [(b + 1) >> 1, b >> 1]; };

function cellSize(n) {
  const [xb, yb] = axisBits(n);
  return [(X1 - X0) / 2 ** xb, (Y1 - Y0) / 2 ** yb];
}

function encode(lat, lng, n) {
  const position = fullIndex(lat, lng) >> BigInt(2 * PRECISION - positionBits(n));
  const value = n < MAX_WORDS ? position
    : (position << BigInt(CHECK_BITS)) | checksum(position);
  const out = [];
  for (let i = 0; i < n; i++) out.push(WORDS[Number((value >> BigInt(BITS * (n - 1 - i))) & 0x7ffn)]);
  return out;
}

function decode(spoken) {
  const unknown = spoken.filter((w) => !INDEX.has(w));
  if (unknown.length) throw new Error(`not BIP-39 words: ${unknown.join(', ')}`);
  if (spoken.length < 1 || spoken.length > MAX_WORDS) throw new Error(`1 to ${MAX_WORDS} words`);
  let value = 0n;
  for (const w of spoken) value = (value << BigInt(BITS)) | BigInt(INDEX.get(w));
  const n = spoken.length;
  let prefix;
  if (n < MAX_WORDS) prefix = value;
  else {
    prefix = value >> BigInt(CHECK_BITS);
    if ((value & ((1n << BigInt(CHECK_BITS)) - 1n)) !== checksum(prefix))
      throw new Error('checksum failed - a word is wrong');
  }
  const bits = positionBits(n), [xb, yb] = axisBits(n);
  let xi = 0n, yi = 0n;
  for (let pos = 0; pos < bits; pos++) {
    const bit = (prefix >> BigInt(bits - 1 - pos)) & 1n;
    if (pos % 2 === 0) xi = (xi << 1n) | bit; else yi = (yi << 1n) | bit;
  }
  return unproject(X0 + (Number(xi) + 0.5) / 2 ** xb * (X1 - X0),
                   Y0 + (Number(yi) + 0.5) / 2 ** yb * (Y1 - Y0));
}

// --- map -------------------------------------------------------------------
const map = L.map('map').setView([53.5, -4.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);
L.rectangle([[BOX.latMin, BOX.lngMin], [BOX.latMax, BOX.lngMax]],
  { color: '#1a5c4a', weight: 1, fill: false, dashArray: '5 4' }).addTo(map);

const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
const errEl = document.getElementById('err');
let marker = null, boxes = [], point = null, selected = 3;

const fmt = (m) => m >= 1000 ? `${(m / 1000).toFixed(1)} km` : m >= 1 ? `${m.toFixed(1)} m` : `${(m * 100).toFixed(0)} cm`;

function cellBounds(lat, lng, n) {
  const [xb, yb] = axisBits(n);
  const [x, y] = project(lat, lng);
  const w = (X1 - X0) / 2 ** xb, h = (Y1 - Y0) / 2 ** yb;
  const cx = X0 + Math.floor((x - X0) / w) * w, cy = Y0 + Math.floor((y - Y0) / h) * h;
  const sw = unproject(cx, cy), ne = unproject(cx + w, cy + h);
  return [sw, ne];
}

function show(lat, lng) {
  point = [lat, lng];
  emptyEl.hidden = true; rowsEl.hidden = false;
  rowsEl.replaceChildren();
  const full = encode(lat, lng, MAX_WORDS);
  for (let n = 1; n <= MAX_WORDS; n++) {
    const parts = full.slice(0, n);
    const [w, h] = cellSize(n);
    const tr = document.createElement('tr');
    if (n === selected) tr.className = 'sel';
    const td = document.createElement('td'); td.className = 'a';
    parts.forEach((word, i) => {
      if (i) { const d = document.createElement('span'); d.className = 'dot'; d.textContent = '.'; td.appendChild(d); }
      // Only the word this row adds is highlighted; the rest are already said.
      const s = document.createElement('span');
      if (i === n - 1) s.className = 'new';
      s.textContent = word; td.appendChild(s);
    });
    const ts = document.createElement('td'); ts.className = 's';
    ts.textContent = n === MAX_WORDS ? `${fmt(Math.sqrt(w * h))} · checked` : fmt(Math.sqrt(w * h));
    tr.append(td, ts);
    tr.addEventListener('click', () => { selected = n; show(lat, lng); });
    rowsEl.appendChild(tr);
  }
  if (marker) map.removeLayer(marker);
  marker = L.circleMarker([lat, lng], { radius: 5, color: '#a8322a', weight: 2, fillOpacity: .9 }).addTo(map);
  boxes.forEach((b) => map.removeLayer(b)); boxes = [];
  // Draw the nesting: each length is a box inside the previous one.
  for (let n = 1; n <= Math.min(selected + 1, MAX_WORDS); n++) {
    boxes.push(L.rectangle(cellBounds(lat, lng, n),
      { color: n === selected ? '#1a5c4a' : '#8a8a82',
        weight: n === selected ? 2 : 1, fill: false }).addTo(map));
  }
}

map.on('click', (e) => { errEl.textContent = ''; show(e.latlng.lat, e.latlng.lng); });

document.getElementById('go').addEventListener('click', () => {
  const parts = document.getElementById('dec').value.trim().toLowerCase().split(/[.\s,]+/).filter(Boolean);
  errEl.textContent = '';
  try {
    const [lat, lng] = decode(parts);
    selected = parts.length;
    const [w, h] = cellSize(parts.length);
    map.fitBounds(cellBounds(lat, lng, parts.length), { maxZoom: 19 });
    show(lat, lng);
  } catch (e) { errEl.textContent = e.message; }
});

show(51.50072, -0.12456);
</script>
