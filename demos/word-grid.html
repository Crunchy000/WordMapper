<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Five everyday words name any point on earth to about ten metres. Say four where the country you are in supplies the fifth.">
<title>Word grid — five easy words anywhere, four where a country supplies the last</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe3e6; }
  /* No card: the address sits directly on the map, with a halo rather than a
     panel so it reads over pale streets and dark satellite tiles alike. */
  #hud { position: absolute; z-index: 1000; top: 16px; left: 16px;
         pointer-events: none; max-width: calc(100vw - 32px); }
  #addr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 20px; letter-spacing: -0.01em;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 0 0 16px #fff,
                       1px 0 3px #fff, -1px 0 3px #fff, 0 -1px 3px #fff; }
  #dropped { color: #b9b9b2; }
  #words { color: #16171a; font-weight: 700; }
  #sep { color: #9a9a92; margin: 0 8px; }
  /* The last word is set apart because it does a different job: it refines the
     position and carries the checksum. */
  #check { color: #1a5c4a; font-weight: 700; font-style: italic;
           border-bottom: 2px dotted #4f9481; padding-bottom: 1px; }
  #note { font-size: 12px; color: #4a4a44; margin-top: 5px; font-weight: 600;
          text-shadow: 0 1px 3px #fff, 0 0 8px #fff, 1px 0 3px #fff, -1px 0 3px #fff; }
  #note .dim { color: #8a8a82; font-weight: 400; }
  @media (max-width: 480px) {
    #hud { top: 12px; left: 12px; }
    #addr { font-size: 15px; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>

<div id="hud">
  <div id="addr"><span id="dropped"></span><span id="words"></span><span id="sep">&middot;</span><span id="check"></span></div>

const INDEX = new Map(WORDS.map((w, i) => [w, i]));

// --- the scheme ------------------------------------------------------------
// Must match tools/gridcode/bip39grid.py exactly; CI cross-checks them.
const R = 6371008.8;
// Lambert equal-area, with the standard parallel chosen so the PROJECTED WORLD
// IS SQUARE. Its aspect is pi*K^2, so K = 1/sqrt(pi) makes it exactly 1.
//
// That is what makes cells square. Cell aspect is the frame's aspect times
// 2**(yb-xb), and xb+yb is fixed by the address length, so parity decides which
// powers of two are reachable: an even bit count can only land on frame*4**k.
// With a square frame the even lengths -- which include both terminal lengths --
// come out exactly 1:1, for the same cell area, since only the shape changes.
// The odd lengths land on frame*2*4**k and so go to 2:1; no frame can square
// both, because one exponent is odd whenever the other is even.
const K = 1 / Math.sqrt(Math.PI);
const BITS = 10;
// The last word does two jobs: 4 bits refine the position, 7 carry a checksum.
const REFINE_BITS = 2, CHECK_BITS = BITS - REFINE_BITS;
const WORD_MASK = (1n << BigInt(BITS)) - 1n;
const SEP = '.';
const EPS = 1e-9;

const project = (lat, lng) => [R * lng * Math.PI / 180 * K,
                               R * Math.sin(lat * Math.PI / 180) / K];
const unproject = (x, y) => [Math.asin(Math.max(-1, Math.min(1, y * K / R))) * 180 / Math.PI,
                             x / (R * K) * 180 / Math.PI];

// A scope is a box, an address length, and the bit layout they imply. There is
// one of these -- GLOBAL. It stays a function because the bit layout is DERIVED
// from the box rather than written down.
function makeScope(key, name, box, maxWords) {
  const [latMin, latMax, lngMin, lngMax] = box;
  const [x0, y0] = project(latMin, lngMin);
  const [x1, y1] = project(latMax, lngMax);
  const xr = Math.abs(x1 - x0), yr = Math.abs(y1 - y0);
  const positionBitsTotal = BITS * (maxWords - 1) + REFINE_BITS;
  // Which axis each position bit refines, coarse bit first. Not a plain
  // alternation: a box wider than it is tall would carry that aspect down into
  // every cell. Giving each bit to whichever axis is currently wider keeps
  // cells near square at every length, for the same cell area -- the
  // projection is equal-area, so only the shape changes.
  const order = []; let w = xr, h = yr;
  for (let i = 0; i < positionBitsTotal; i++) {
    if (w >= h) { order.push(0); w /= 2; } else { order.push(1); h /= 2; }
  }
  const xb = order.filter((a) => a === 0).length;
  return { key, name, box, maxWords, x0, y0, xr, yr,
           positionBitsTotal, order, xb, yb: positionBitsTotal - xb };
}
// Five words over the whole earth, and the only scope there is. A box has to
// be a rectangle and most of the world cannot be boxed without swallowing a
// neighbour, so the regional boxes that used to be here are gone; a country
// supplies the leading word instead, further down.
const GLOBAL = makeScope('global', 'Global', [-90, 90, -180, 180], 5);

const wrapLng = (lng) => ((lng + 180) % 360 + 360) % 360 - 180;

// Bring a longitude into the box's frame. The short circuit matters: a value a
// hair BELOW lngMin would otherwise wrap to nearly lngMin + 360, throwing a
// point on the western edge out of its box.
function normaliseLng(lng, sc) {
  const lngMin = sc.box[2], lngMax = sc.box[3];
  if (lng >= lngMin - EPS && lng <= lngMax + EPS) return lng;
  return lngMin + ((((lng - lngMin) % 360) + 360) % 360);
}

function covers(lat, lng, sc) {
  const [latMin, latMax, lngMin, lngMax] = sc.box;
  const l = normaliseLng(lng, sc);
  return lat >= latMin - EPS && lat <= latMax + EPS
      && l >= lngMin - EPS && l <= lngMax + EPS;
}

// Both ends are clamped. The top saturates a point on the boundary -- the
// poles, the antimeridian -- into the last cell. The bottom is only reachable
// by floating-point slop, but an unclamped negative index would sign-extend
// under >> and mint a plausible address for the wrong place.
function indices(lat, lng, sc) {
  if (!covers(lat, lng, sc)) throw new Error(`outside ${sc.name}`);
  const [x, y] = project(lat, normaliseLng(lng, sc));
  const cell = (v, lo, span, bits) =>
    Math.min(Math.max(Math.floor((v - lo) / span * 2 ** bits), 0), 2 ** bits - 1);
  return [cell(x, sc.x0, sc.xr, sc.xb), cell(y, sc.y0, sc.yr, sc.yb)];
}

function interleave(xi, yi, sc) {
  let v = 0n, xa = sc.xb, ya = sc.yb;
  const X = BigInt(xi), Y = BigInt(yi);
  for (const axis of sc.order) {
    if (axis === 0) { xa--; v = (v << 1n) | ((X >> BigInt(xa)) & 1n); }
    else { ya--; v = (v << 1n) | ((Y >> BigInt(ya)) & 1n); }
  }
  return v;
}

function deinterleave(v, bits, sc) {
  let xi = 0n, yi = 0n;
  for (let i = 0; i < bits; i++) {
    const bit = (v >> BigInt(bits - 1 - i)) & 1n;
    if (sc.order[i] === 0) xi = (xi << 1n) | bit; else yi = (yi << 1n) | bit;
  }
  return [Number(xi), Number(yi)];
}

const positionBits = (n, sc) => (n < sc.maxWords ? BITS * n : sc.positionBitsTotal);
const axisBits = (n, sc) => {
  const b = positionBits(n, sc);
  const xb = sc.order.slice(0, b).filter((a) => a === 0).length;
  return [xb, b - xb];
};

function cellSize(n, sc) {
  const [xb, yb] = axisBits(n, sc);
  return [sc.xr / 2 ** xb, sc.yr / 2 ** yb];
}

// The ambiguity left when an address is given as its last n words.
function tileSize(nSaid, sc) {
  if (nSaid >= sc.maxWords) return [sc.xr, sc.yr];
  const [xb, yb] = axisBits(sc.maxWords - nSaid, sc);
  return [sc.xr / 2 ** xb, sc.yr / 2 ** yb];
}

// How many low bits of each axis index a tail of nSaid words pins down.
function knownLow(nSaid, sc) {
  const dropped = BITS * (sc.maxWords - nSaid);
  const dx = sc.order.slice(0, dropped).filter((a) => a === 0).length;
  return [sc.xb - dx, sc.yb - (dropped - dx)];
}

// SHA-256 in plain JS. crypto.subtle would be neater but only exists in a
// secure context, so it is undefined when this file is opened from disk --
// which would silently break the checksum for anyone who downloads the demo.

  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(bytes) {

  const len = bytes.length;
  const padded = new Uint8Array((((len + 9) >> 6) + 1) << 6);
  padded.set(bytes);
  padded[len] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 4, len * 8);
  const w = new Uint32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    const dv = new DataView(padded.buffer, off, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a,b,c,d,e,f,g,h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
  }
  return H;
}


// Seven bits over the whole position -- which is what makes both kinds of
// shortening safe, since a reconstruction that guesses wrong fails it.
function checksum(position, sc) {
  const p = new Array(8);
  let v = position;
  for (let i = 7; i >= 0; i--) { p[i] = Number(v & 0xffn); v >>= 8n; }
  return BigInt(sha256(p)[0] >>> (32 - CHECK_BITS));
}

function value(lat, lng, sc) {
  const position = interleave(...indices(lat, lng, sc), sc);
  return (position << BigInt(CHECK_BITS)) | checksum(position, sc);
}

// The first n words. Coarser as n falls; needs no context at any length.
function encode(lat, lng, n, sc) {
  let v = value(lat, lng, sc);
  if (n < sc.maxWords) v >>= BigInt(BITS * (sc.maxWords - n));
  const out = [];
  for (let i = 0; i < n; i++) out.push(WORDS[Number((v >> BigInt(BITS * (n - 1 - i))) & WORD_MASK)]);
  return out;
}

// A box past 180 unprojects past 180 too; bring it back to -180..180.
function fromPosition(position, sc) {
  const [xi, yi] = deinterleave(position, sc.positionBitsTotal, sc);
  const ll = unproject(sc.x0 + (xi + 0.5) / 2 ** sc.xb * sc.xr,
                       sc.y0 + (yi + 0.5) / 2 ** sc.yb * sc.yr);
  return [ll[0], wrapLng(ll[1])];
}

// An absolute address: the first n words, coarser as n falls.
function decode(spoken, sc) {
  const unknown = spoken.filter((w) => !INDEX.has(w));
  if (unknown.length) throw new Error(`not BIP-39 words: ${unknown.join(', ')}`);
  if (spoken.length < 1 || spoken.length > sc.maxWords)
    throw new Error(`1 to ${sc.maxWords} words in ${sc.name}`);
  let v = 0n;
  for (const w of spoken) v = (v << BigInt(BITS)) | BigInt(INDEX.get(w));
  let prefix;
  if (spoken.length < sc.maxWords) prefix = v;
  else {
    prefix = v >> BigInt(CHECK_BITS);
    if ((v & ((1n << BigInt(CHECK_BITS)) - 1n)) !== checksum(prefix, sc))
      throw new Error('checksum failed - a word is wrong');
  }
  const bits = positionBits(spoken.length, sc);
  const [xb, yb] = axisBits(spoken.length, sc);
  const [xi, yi] = deinterleave(prefix, bits, sc);
  const ll = unproject(sc.x0 + (xi + 0.5) / 2 ** xb * sc.xr,
                       sc.y0 + (yi + 0.5) / 2 ** yb * sc.yr);
  return [ll[0], wrapLng(ll[1])];
}

// An address given as its last words, plus a reference point. The dropped
// words are the coarse ones, so the reference supplies them: on each axis take
// the candidate matching the known low bits that is nearest the reference. The
// checksum then covers the whole reconstruction, so a reference too far off to
// pick the right tile is caught rather than resolving quietly to the wrong place.
function resolveTail(spoken, nearLat, nearLng, sc) {
  const unknown = spoken.filter((w) => !INDEX.has(w));
  if (unknown.length) throw new Error(`not BIP-39 words: ${unknown.join(', ')}`);
  const n = spoken.length;
  if (n < 1 || n > sc.maxWords) throw new Error(`1 to ${sc.maxWords} words in ${sc.name}`);
  let low = 0n;
  for (const w of spoken) low = (low << BigInt(BITS)) | BigInt(INDEX.get(w));
  const check = low & ((1n << BigInt(CHECK_BITS)) - 1n);
  const knownBits = BITS * n - CHECK_BITS;
  const posLow = low >> BigInt(CHECK_BITS);
  const [cx, cy] = knownLow(n, sc);
  let knownX = 0, knownY = 0;
  for (let i = 0; i < knownBits; i++) {
    const seq = sc.positionBitsTotal - knownBits + i;
    const bit = Number((posLow >> BigInt(knownBits - 1 - i)) & 1n);
    if (sc.order[seq] === 0) knownX = knownX * 2 + bit; else knownY = knownY * 2 + bit;
  }
  const [xiRef, yiRef] = indices(nearLat, nearLng, sc);
  // x wraps: the projection is a cylinder, so a reference a few kilometres west
  // of the antimeridian is a whole world-width away in index terms while being
  // next door on the ground. Linear arithmetic picks a tile on the far side.
  const clampLattice = (known, period, ref, bits) => {
    const v = known + Math.round((ref - known) / period) * period;
    return Math.min(Math.max(v, known),
      known + Math.floor((2 ** bits - 1 - known) / period) * period);
  };
  const periodX = 2 ** cx, totalX = 2 ** sc.xb;
  let xi;
  if (sc === GLOBAL) {
    const k = Math.round((((xiRef - knownX) % totalX + totalX) % totalX) / periodX)
      % (totalX / periodX);
    xi = (knownX + k * periodX) % totalX;
  } else {
    xi = clampLattice(knownX, periodX, xiRef, sc.xb);   // a partial box does not wrap
  }
  // y never wraps -- latitude ends at the poles -- so clamp, but to the last
  // point ON the lattice: clamping to the last index would leave a value the
  // known bits do not match.
  const yi = clampLattice(knownY, 2 ** cy, yiRef, sc.yb);
  const position = interleave(xi, yi, sc);
  if (checksum(position, sc) !== check)
    throw new Error('checksum failed - a word is wrong, or the reference point '
      + 'is too far away to fill in the missing words');
  return fromPosition(position, sc);
}

// The fewest trailing words that resolve back to this point from that reference.
function wordsNeeded(lat, lng, nearLat, nearLng, sc) {
  const full = encode(lat, lng, sc.maxWords, sc);
  const want = indices(lat, lng, sc);
  for (let n = 1; n <= sc.maxWords; n++) {
    try {
      const got = indices(...resolveTail(full.slice(-n), nearLat, nearLng, sc), sc);
      if (got[0] === want[0] && got[1] === want[1]) return n;
    } catch { /* checksum rejected this length; try a longer tail */ }
  }
  return sc.maxWords;
}

// '.cruel.tomato.tone' -- the leading separator says the coarse words are
// missing and context must supply them.
const formatAddress = (spoken, tail) => (tail ? SEP : '') + spoken.join(SEP);

function parseAddress(text) {
  text = text.trim().replace(/[,\s]+/g, SEP);
  const tail = text.startsWith(SEP);
  const parts = text.split(SEP).filter(Boolean).map((p) => p.toLowerCase());
  if (!parts.length) throw new Error('empty address');
  return [parts, tail];
}


// --- the country, from OpenStreetMap ---------------------------------------
// Nominatim's reverse geocoder returns the country AND its bounding box, which
// is all this needs: the box is only a search window, never part of an address.
//
// The grid does not depend on any of this. The five-word address is computed
// and shown offline, immediately; the lookup only ever SHORTENS it. If the
// network is down, or the country moves, or a border is redrawn, the five-word
// address is unchanged and still correct.
const GEOCODER = 'https://nominatim.openstreetmap.org/reverse';
const cache = new Map();
let lastCall = 0;

async function countryAt(lat, lng) {
  const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;
  if (cache.has(key)) return cache.get(key);
  // Nominatim asks for at most one request a second, and for callers to
  // identify themselves. A browser cannot set User-Agent, so the Referer this
  // page sends is the identification -- which is what their policy expects of a
  // web app. Results are cached by two decimal places, about a kilometre, so
  // clicking around one place asks once.
  const wait = Math.max(0, 1100 - (Date.now() - lastCall));
  if (wait) await new Promise((r) => setTimeout(r, wait));
  lastCall = Date.now();
  const url = `${GEOCODER}?lat=${lat}&lon=${lng}&format=jsonv2&zoom=3`;
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error(`geocoder returned ${res.status}`);
  const d = await res.json();
  const bb = (d.boundingbox || []).map(Number);      // [south, north, west, east]
  const name = (d.address && d.address.country) || null;
  const out = (name && bb.length === 4 && bb.every(Number.isFinite))
    ? { name, box: bb } : null;
  cache.set(key, out);
  return out;
}

// --- shortening -------------------------------------------------------------
// Every point inside the box whose address ends with these words and whose
// checksum passes. The country picks the window; the checksum picks the answer.
function candidatesInBox(tail, box, sc, limit = 20000) {
  const n = tail.length;
  let value = 0n;
  for (const w of tail) value = (value << BigInt(BITS)) | BigInt(INDEX.get(w));
  const check = value & ((1n << BigInt(CHECK_BITS)) - 1n);
  const knownBits = BITS * n - CHECK_BITS;
  const posLow = value >> BigInt(CHECK_BITS);
  const [cx, cy] = knownLow(n, sc);
  let knownX = 0, knownY = 0;
  for (let i = 0; i < knownBits; i++) {
    const seq = sc.positionBitsTotal - knownBits + i;
    const bit = Number((posLow >> BigInt(knownBits - 1 - i)) & 1n);
    if (sc.order[seq] === 0) knownX = knownX * 2 + bit; else knownY = knownY * 2 + bit;
  }
  const [south, north, west, east] = box;
  const [xa, ya] = project(south, normaliseLng(west, sc));
  const [xb2, yb2] = project(north, normaliseLng(east, sc));
  const toI = (v, lo, span, bits) => Math.floor((v - lo) / span * 2 ** bits);
  const loX = Math.max(0, toI(Math.min(xa, xb2), sc.x0, sc.xr, sc.xb));
  const hiX = Math.min(2 ** sc.xb - 1, toI(Math.max(xa, xb2), sc.x0, sc.xr, sc.xb));
  const loY = Math.max(0, toI(Math.min(ya, yb2), sc.y0, sc.yr, sc.yb));
  const hiY = Math.min(2 ** sc.yb - 1, toI(Math.max(ya, yb2), sc.y0, sc.yr, sc.yb));
  const px = 2 ** cx, py = 2 ** cy;
  const firstX = knownX + Math.ceil((loX - knownX) / px) * px;
  const firstY = knownY + Math.ceil((loY - knownY) / py) * py;
  const nx = Math.max(0, Math.floor((hiX - firstX) / px) + 1);
  const ny = Math.max(0, Math.floor((hiY - firstY) / py) + 1);
  if (nx * ny > limit) return { hits: null, searched: nx * ny };
  const hits = [];
  for (let xi = firstX; xi <= hiX; xi += px) {
    for (let yi = firstY; yi <= hiY; yi += py) {
      const position = interleave(xi, yi, sc);
      if (checksum(position, sc) === check) hits.push(fromPosition(position, sc));
    }
  }
  return { hits, searched: nx * ny };
}

// Searching a region trades DETECTION for a word, and MAX_CANDIDATES is the cap
// on that trade. When a word is wrong the true tile is gone, so every candidate
// in the window is a fresh lottery against the same 7 check bits and a wrong
// word is caught only (127/128)**k of the time. Six holds that at 95.4%,
// against 99.2% for the full address; an uncapped window the size of Australia
// holds ~70 and falls to 58%, where a third of mishearings resolve silently to
// somewhere else in the country. resolveTail() has no such loss -- it tests the
// single nearest tile, one chance to be fooled rather than k.
const MAX_CANDIDATES = 6;

// The fewest trailing words that identify this point uniquely inside the box
// WITHOUT weakening the check past that cap. The cap doubles as the enumeration
// limit, so a window it would reject is counted and dropped rather than
// searched.
function shortestInBox(lat, lng, box, sc) {
  const full = encode(lat, lng, sc.maxWords, sc);
  const want = indices(lat, lng, sc);
  for (let n = 1; n < sc.maxWords; n++) {
    const { hits, searched } = candidatesInBox(full.slice(-n), box, sc, MAX_CANDIDATES);
    if (searched > MAX_CANDIDATES) continue;
    if (hits && hits.length === 1) {
      const got = indices(hits[0][0], hits[0][1], sc);
      if (got[0] === want[0] && got[1] === want[1]) return n;
    }
  }
  return sc.maxWords;
}

// The reader's half, and where the cap actually protects anyone: a window too
// big to screen is refused rather than answered from.
function decodeInBox(spoken, box, sc) {
  const { hits, searched } = candidatesInBox(spoken, box, sc, MAX_CANDIDATES);
  if (searched > MAX_CANDIDATES)
    throw new Error(`${searched} candidates in this region, more than the `
      + `${MAX_CANDIDATES} a 7-bit check can screen - say the whole address`);
  if (!hits || !hits.length)
    throw new Error('checksum failed - a word is wrong, or this address does '
      + 'not belong in this region');
  if (hits.length > 1)
    throw new Error(`${hits.length} places here match - say one more word`);
  return hits[0];
}

// --- map --------------------------------------------------------------------
// The zoom control sits top right: the address lives top left, where it reads
// best, and the two were overlapping.
const map = L.map('map', { worldCopyJump: true, zoomControl: false })
  .setView([53.3498, -6.2603], 16);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const droppedEl = document.getElementById('dropped');
const wordsEl = document.getElementById('words');
const checkEl = document.getElementById('check');
const noteEl = document.getElementById('note');
const scope = GLOBAL;
let marker = null, cellBox = null, seq = 0;

const fmt = (m) => m >= 1000 ? `${(m / 1000).toFixed(1)} km`
  : m >= 1 ? `${m.toFixed(2)} m` : `${(m * 100).toFixed(0)} cm`;

// One grid, so this never changes -- which is the thing worth saying.
function gridHint() {
  const [w, h] = cellSize(scope.maxWords, scope);
  return fmt(Math.sqrt(w * h));
}

function draw(lat, lng, said) {
  const full = encode(lat, lng, scope.maxWords, scope);
  const kept = full.slice(full.length - said);
  // The dropped words are shown greyed rather than hidden, so it is obvious
  // what the country is standing in for.
  droppedEl.textContent = said < full.length
    ? full.slice(0, full.length - said).join(SEP) + SEP : '';
  wordsEl.textContent = kept.slice(0, -1).join(SEP);
  checkEl.textContent = kept[kept.length - 1];
}

async function show(lat, lng) {
  const mine = ++seq;
  if (marker) map.removeLayer(marker);
  marker = L.circleMarker([lat, lng],
    { radius: 5, color: '#a8322a', weight: 2, fillOpacity: .9 }).addTo(map);
  if (cellBox) { map.removeLayer(cellBox); cellBox = null; }
  const [xb, yb] = axisBits(scope.maxWords, scope);
  const [x, y] = project(lat, normaliseLng(lng, scope));
  const w = scope.xr / 2 ** xb, h = scope.yr / 2 ** yb;
  const cx = scope.x0 + Math.floor((x - scope.x0) / w) * w;
  const cy = scope.y0 + Math.floor((y - scope.y0) / h) * h;
  const sw = unproject(cx, cy), ne = unproject(cx + w, cy + h);
  cellBox = L.rectangle([[sw[0], wrapLng(sw[1])], [ne[0], wrapLng(sw[1]) + (ne[1] - sw[1])]],
    { color: '#1a5c4a', weight: 2, fill: false }).addTo(map);

  // The full address first, with no network involved at all.
  draw(lat, lng, scope.maxWords);
  noteEl.innerHTML = `${gridHint()}<span class="dim"> &mdash; asking OpenStreetMap `
    + 'which country&hellip;</span>';
  let country;
  try {
    country = await countryAt(lat, lng);
  } catch (e) {
    if (mine !== seq) return;
    noteEl.innerHTML = `${gridHint()}<span class="dim"> &mdash; no country lookup `
      + `(${e.message}), so all ${scope.maxWords} words</span>`;
    return;
  }
  if (mine !== seq) return;                 // a later click has overtaken this one
  if (!country) {
    noteEl.innerHTML = `${gridHint()}<span class="dim"> &mdash; open water, no country `
      + `to drop a word, so all ${scope.maxWords}</span>`;
    return;
  }
  const said = shortestInBox(lat, lng, country.box, scope);
  draw(lat, lng, said);
  // The cell size is the hint worth showing: it is the same 1.35 m whether the
  // country bought a word or not, which is the point of one grid.
  noteEl.innerHTML = `${country.name} &middot; ${gridHint()}`
    + (said < scope.maxWords ? ''
       : '<span class="dim"> &mdash; too wide a box to drop a word safely</span>');
}

map.on('click', (e) => show(e.latlng.lat, wrapLng(e.latlng.lng)));
show(53.3498, -6.2603);
</script>
</body>
</html>
