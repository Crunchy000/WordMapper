name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The grid is H3, so both ports need it -- h3 for the Python reference,
      # h3-js for the demo's port -- pinned to the same 4.5.0 core so they
      # agree cell for cell. setup-python because the runner's system Python
      # refuses pip installs; node is the runner's own.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install H3
        run: |
          python3 -m pip install -r tools/gridcode/requirements.txt
          npm ci --prefix tools/gridcode

      # The demo carries its own JavaScript port of the codec. Fail the build if
      # it stops agreeing with the Python reference, or stops round-tripping.
      - name: Check demo codec against the reference
        run: node tools/gridcode/check-demo.mjs

      - name: Check the scheme
        run: python3 tools/gridcode/test_bip39grid.py

      # The UK grid is a second scheme with its own JavaScript port and mask.
      - name: Check the UK demo codec against the reference
        run: node tools/gridcode/check-uk-demo.mjs

      - name: Check the UK scheme
        run: python3 tools/gridcode/test_ukgrid.py

      - name: Check the UK phrase demo codec against the reference
        run: node tools/gridcode/check-ukphrase-demo.mjs

      - name: Check the UK phrases
        run: python3 tools/gridcode/test_ukphrase.py

      - name: Assemble site
        run: |
          mkdir -p _site/demos
          cp index.html _site/
          cp demos/*.html _site/demos/
          ls -R _site

      # Pull requests stop here: the grid check and the build are the gate.
      #
      # This step needs Pages already switched on for the repository:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # It is a one-time manual step. The workflow cannot do it itself --
      # creating a Pages site needs repo-admin rights, and the Actions token's
      # pages: write permission only covers deploying to an existing site
      # (enablement: true fails with "Resource not accessible by integration").
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    # Only publish from main; on pull requests the build job alone is the check.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
