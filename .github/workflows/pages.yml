name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install codec dependencies
        run: npm install --prefix tools/gridcode --no-audit --no-fund

      # The demo carries its own JavaScript port of the codec. Fail the build if
      # it stops agreeing with the Python reference, or stops round-tripping.
      - name: Check demo codec against the reference
        run: node tools/gridcode/check-demo.mjs

      - name: Check the scheme
        run: python3 tools/gridcode/test_bip39grid.py

      - name: Assemble site
        run: |
          mkdir -p _site/demos
          cp index.html _site/
          cp demos/*.html _site/demos/
          ls -R _site

      # Pull requests stop here: the grid check and the build are the gate.
      #
      # This step needs Pages already switched on for the repository:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # It is a one-time manual step. The workflow cannot do it itself --
      # creating a Pages site needs repo-admin rights, and the Actions token's
      # pages: write permission only covers deploying to an existing site
      # (enablement: true fails with "Resource not accessible by integration").
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    # Only publish from main; on pull requests the build job alone is the check.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
